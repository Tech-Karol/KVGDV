<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KVGDV Maps — GeoJSON Converter</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #0b0f14;
      color: #f1f5f9;

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .container {
      width: min(560px, calc(100% - 32px));
      padding: 32px;

      background: #151b23;
      border: 1px solid #28313d;
      border-radius: 20px;

      box-shadow: 0 20px 60px rgba(0, 0, 0, .4);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
    }

    .subtitle {
      margin: 0 0 28px;
      color: #8b98a8;
    }

    .dropzone {
      padding: 35px 20px;

      border: 2px dashed #354252;
      border-radius: 14px;

      text-align: center;

      cursor: pointer;

      transition: .2s;
    }

    .dropzone:hover,
    .dropzone.dragover {
      border-color: #5b8def;
      background: #192231;
    }

    .dropzone strong {
      display: block;
      margin-bottom: 8px;
      font-size: 17px;
    }

    .dropzone span {
      color: #8b98a8;
      font-size: 14px;
    }

    input[type="file"] {
      display: none;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 15px;

      border: 0;
      border-radius: 12px;

      background: #4f8cff;
      color: white;

      font-size: 15px;
      font-weight: 700;

      cursor: pointer;
    }

    button:hover {
      background: #6b9eff;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #fileName {
      margin-top: 16px;

      color: #aeb9c7;
      font-size: 14px;

      text-align: center;
    }

    #status {
      margin-top: 20px;

      padding: 12px;

      border-radius: 10px;

      background: #0e131a;

      color: #8b98a8;

      font-size: 13px;
      line-height: 1.5;
    }

    .success {
      color: #7ee787 !important;
    }

    .error {
      color: #ff7b72 !important;
    }
  </style>
</head>

<body>

  <main class="container">

    <h1>🗺️ KVGDV Maps</h1>

    <p class="subtitle">
      Konwerter GeoJSON → KVGDV Maps
    </p>

    <label
      class="dropzone"
      id="dropzone"
      for="geojsonFile"
    >
      <strong>📁 Wybierz plik GeoJSON</strong>

      <span>
        Kliknij tutaj albo przeciągnij plik .geojson
      </span>
    </label>

    <input
      id="geojsonFile"
      type="file"
      accept=".geojson,.json,application/geo+json,application/json"
    >

    <div id="fileName">
      Nie wybrano pliku.
    </div>

    <button
      id="convertButton"
      disabled
    >
      🚀 Wygeneruj zachodniopomorskie.json
    </button>

    <div id="status">
      Oczekiwanie na plik GeoJSON...
    </div>

  </main>


  <script>

    const fileInput =
      document.getElementById("geojsonFile");

    const dropzone =
      document.getElementById("dropzone");

    const convertButton =
      document.getElementById("convertButton");

    const fileName =
      document.getElementById("fileName");

    const status =
      document.getElementById("status");


    let selectedFile = null;


    /*
     * =====================================================
     * WYBÓR PLIKU
     * =====================================================
     */

    fileInput.addEventListener(
      "change",
      () => {

        if (!fileInput.files.length) {
          return;
        }

        selectedFile =
          fileInput.files[0];

        showFile();

      }
    );


    function showFile() {

      fileName.textContent =
        "📄 " +
        selectedFile.name;

      convertButton.disabled =
        false;

      status.className = "";

      status.textContent =
        "Plik gotowy do konwersji.";

    }


    /*
     * =====================================================
     * DRAG & DROP
     * =====================================================
     */

    dropzone.addEventListener(
      "dragover",
      event => {

        event.preventDefault();

        dropzone.classList.add(
          "dragover"
        );

      }
    );


    dropzone.addEventListener(
      "dragleave",
      () => {

        dropzone.classList.remove(
          "dragover"
        );

      }
    );


    dropzone.addEventListener(
      "drop",
      event => {

        event.preventDefault();

        dropzone.classList.remove(
          "dragover"
        );


        const files =
          event.dataTransfer.files;


        if (!files.length) {
          return;
        }


        selectedFile =
          files[0];


        showFile();

      }
    );


    /*
     * =====================================================
     * KONWERSJA
     * =====================================================
     */

    convertButton.addEventListener(
      "click",
      async () => {

        if (!selectedFile) {
          return;
        }


        convertButton.disabled =
          true;


        status.className = "";

        status.textContent =
          "⏳ Czytanie GeoJSON...";


        try {

          const text =
            await selectedFile.text();


          const geojson =
            JSON.parse(text);


          validateGeoJSON(
            geojson
          );


          status.textContent =
            "🔄 Konwertowanie geometrii...";


          const roads =
            extractRoads(
              geojson
            );


          const result = {

            schema:
              "kvgdv-map",

            version:
              "0.1.0",


            region: {

              name:
                "Województwo zachodniopomorskie",

              country:
                "Polska",

              countryCode:
                "PL",

              regionCode:
                "PL-32"

            },


            source: {

              name:
                "OpenStreetMap",

              license:
                "ODbL",

              attribution:
                "© OpenStreetMap contributors"

            },


            places: [

              {

                id:
                  "place-redlino",

                name:
                  "Redlino",

                type:
                  "village",

                coordinates: {

                  lat:
                    54.025456959035,

                  lon:
                    15.9012336035926

                }

              }

            ],


            roads:
              roads,


            buildings: [],

            water: [],

            forests: [],

            boundaries: [],

            pointsOfInterest: []

          };


          downloadJSON(
            result
          );


          status.className =
            "success";


          status.innerHTML =
            "✅ Gotowe!<br>" +
            "Wyeksportowano <strong>" +
            roads.length +
            "</strong> dróg.<br><br>" +
            "Pobrano: " +
            "<strong>zachodniopomorskie.json</strong>";

        }

        catch (error) {

          console.error(
            error
          );


          status.className =
            "error";


          status.textContent =
            "❌ Błąd: " +
            error.message;

        }


        convertButton.disabled =
          false;

      }
    );


    /*
     * =====================================================
     * WALIDACJA
     * =====================================================
     */

    function validateGeoJSON(
      data
    ) {

      if (!data) {
        throw new Error(
          "Plik jest pusty."
        );
      }


      if (
        data.type !==
          "FeatureCollection" &&
        data.type !==
          "Feature"
      ) {

        throw new Error(
          "To nie wygląda na prawidłowy GeoJSON."
        );

      }

    }


    /*
     * =====================================================
     * WYCIĄGANIE DRÓG
     * =====================================================
     */

    function extractRoads(
      geojson
    ) {

      let features = [];


      if (
        geojson.type ===
        "FeatureCollection"
      ) {

        features =
          geojson.features || [];

      }

      else if (
        geojson.type ===
        "Feature"
      ) {

        features = [
          geojson
        ];

      }


      const roads = [];


      features.forEach(
        (feature, index) => {

          if (!feature.geometry) {
            return;
          }


          const properties =
            feature.properties || {};


          const geometry =
            feature.geometry;


          /*
           * LINESTRING
           */

          if (
            geometry.type ===
            "LineString"
          ) {

            roads.push(
              createRoad(
                feature,
                geometry.coordinates,
                index
              )
            );

          }


          /*
           * MULTILINESTRING
           */

          else if (
            geometry.type ===
            "MultiLineString"
          ) {

            geometry.coordinates.forEach(
              (line, lineIndex) => {

                roads.push(
                  createRoad(
                    feature,
                    line,
                    index +
                      "-" +
                      lineIndex
                  )
                );

              }
            );

          }

        }
      );


      return roads;

    }


    /*
     * =====================================================
     * TWORZENIE DROGI KVGDV
     * =====================================================
     */

    function createRoad(
      feature,
      coordinates,
      index
    ) {

      const properties =
        feature.properties || {};


      const highway =
        properties.highway ||
        "road";


      const name =
        properties.name ||
        null;


      const ref =
        properties.ref ||
        null;


      return {

        id:
          "road-" +
          index,


        name:
          name,


        ref:
          ref,


        type:
          convertRoadType(
            highway
          ),


        highway:
          highway,


        geometry:
          coordinates.map(
            coordinate => ({

              /*
               * GeoJSON:
               * [longitude, latitude]
               */

              lat:
                coordinate[1],

              lon:
                coordinate[0]

            })
          )

      };

    }


    /*
     * =====================================================
     * TYPY DRÓG
     * =====================================================
     */

    function convertRoadType(
      highway
    ) {

      switch (
        highway
      ) {

        case "motorway":
        case "motorway_link":

          return "motorway";


        case "trunk":
        case "trunk_link":

          return "trunk";


        case "primary":
        case "primary_link":

          return "primary";


        case "secondary":
        case "secondary_link":

          return "secondary";


        case "tertiary":
        case "tertiary_link":

          return "tertiary";


        case "residential":

          return "residential";


        case "service":

          return "service";


        case "unclassified":

          return "unclassified";


        case "living_street":

          return "living_street";


        case "track":

          return "track";


        case "path":
        case "footway":
        case "cycleway":

          return "path";


        default:

          return "local";

      }

    }


    /*
     * =====================================================
     * POBIERANIE JSON
     * =====================================================
     */

    function downloadJSON(
      data
    ) {

      const json =
        JSON.stringify(
          data,
          null,
          2
        );


      const blob =
        new Blob(
          [json],
          {
            type:
              "application/json"
          }
        );


      const url =
        URL.createObjectURL(
          blob
        );


      const link =
        document.createElement(
          "a"
        );


      link.href =
        url;


      link.download =
        "zachodniopomorskie.json";


      document.body.appendChild(
        link
      );


      link.click();


      link.remove();


      setTimeout(
        () => {

          URL.revokeObjectURL(
            url
          );

        },
        1000
      );

    }

  </script>

</body>
</html>
