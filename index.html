<script>

const canvas = document.getElementById("mapCanvas");
const ctx = canvas.getContext("2d");

const coordinatesElement =
  document.getElementById("coordinates");

const engineStatus =
  document.getElementById("engineStatus");

const placeCard =
  document.getElementById("placeCard");

const placeName =
  document.getElementById("placeName");

const placeType =
  document.getElementById("placeType");

const searchInput =
  document.getElementById("searchInput");


/* =========================================
   STATE
========================================= */

const state = {

  width: 0,
  height: 0,

  zoom: 25000,

  centerLat: 54.025456959035,
  centerLon: 15.9012336035926,

  mouseX: 0,
  mouseY: 0,

  dragging: false,

  lastMouseX: 0,
  lastMouseY: 0,

  data: null

};


/* =========================================
   POMOCNICZE
========================================= */

/*
  Pobiera wartość z obiektu,
  próbując kilka możliwych nazw.
*/

function getValue(object, names) {

  if (!object || typeof object !== "object") {
    return undefined;
  }

  for (const name of names) {

    if (
      Object.prototype.hasOwnProperty.call(
        object,
        name
      )
    ) {

      return object[name];

    }

  }

  return undefined;

}


/*
  Współrzędne punktu.
*/

function getPointCoordinates(point) {

  if (!point || typeof point !== "object") {
    return null;
  }

  const lat = Number(
    getValue(point, [
      "szer.",
      "szer",
      "lat",
      "latitude"
    ])
  );

  const lon = Number(
    getValue(point, [
      "długość",
      "dług.",
      "dług",
      "lon",
      "lng",
      "longitude"
    ])
  );

  if (
    !Number.isFinite(lat) ||
    !Number.isFinite(lon)
  ) {

    return null;

  }

  return {
    lat,
    lon
  };

}


/*
  Obsługa współrzędnych miejscowości.
*/

function getPlaceCoordinates(place) {

  const coordinates =
    getValue(place, [
      "współrzędne",
      "wspolrzedne",
      "coordinates",
      "koordynaty"
    ]);

  return getPointCoordinates(
    coordinates
  );

}


/* =========================================
   RESIZE
========================================= */

function resizeCanvas() {

  const dpr =
    window.devicePixelRatio || 1;

  state.width =
    window.innerWidth;

  state.height =
    window.innerHeight;

  canvas.width =
    state.width * dpr;

  canvas.height =
    state.height * dpr;

  canvas.style.width =
    state.width + "px";

  canvas.style.height =
    state.height + "px";

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );

  render();

}


window.addEventListener(
  "resize",
  resizeCanvas
);


/* =========================================
   GEO → SCREEN
========================================= */

function geoToScreen(lat, lon) {

  return {

    x:
      state.width / 2 +
      (
        lon -
        state.centerLon
      ) *
      state.zoom,

    y:
      state.height / 2 -
      (
        lat -
        state.centerLat
      ) *
      state.zoom

  };

}


/* =========================================
   SCREEN → GEO
========================================= */

function screenToGeo(x, y) {

  return {

    lon:
      state.centerLon +
      (
        x -
        state.width / 2
      ) /
      state.zoom,

    lat:
      state.centerLat -
      (
        y -
        state.height / 2
      ) /
      state.zoom

  };

}


/* =========================================
   BACKGROUND
========================================= */

function drawBackground() {

  ctx.fillStyle =
    "#10161d";

  ctx.fillRect(
    0,
    0,
    state.width,
    state.height
  );


  const grid =
    Math.max(
      50,
      Math.min(
        100,
        state.zoom / 300
      )
    );


  ctx.strokeStyle =
    "rgba(255,255,255,0.025)";

  ctx.lineWidth = 1;


  for (
    let x = 0;
    x < state.width;
    x += grid
  ) {

    ctx.beginPath();

    ctx.moveTo(x, 0);

    ctx.lineTo(
      x,
      state.height
    );

    ctx.stroke();

  }


  for (
    let y = 0;
    y < state.height;
    y += grid
  ) {

    ctx.beginPath();

    ctx.moveTo(0, y);

    ctx.lineTo(
      state.width,
      y
    );

    ctx.stroke();

  }

}


/* =========================================
   DROGI
========================================= */

function getRoadStyle(road) {

  const highway =
    String(
      getValue(road, [
        "autostrada",
        "highway",
        "typ"
      ]) || ""
    ).toLowerCase();


  if (
    highway.includes("autostrada") ||
    highway.includes("motorway")
  ) {

    return {
      color: "#d18b55",
      width: 8
    };

  }


  if (
    highway.includes("ekspresowa") ||
    highway.includes("trunk")
  ) {

    return {
      color: "#c78a58",
      width: 7
    };

  }


  if (
    highway.includes("główna") ||
    highway.includes("glowna") ||
    highway.includes("primary")
  ) {

    return {
      color: "#b07b57",
      width: 6
    };

  }


  if (
    highway.includes("drugorzędna") ||
    highway.includes("drugorzedna") ||
    highway.includes("wtórny") ||
    highway.includes("wtorny") ||
    highway.includes("secondary")
  ) {

    return {
      color: "#737d89",
      width: 5
    };

  }


  if (
    highway.includes("trzeciorzędna") ||
    highway.includes("trzeciorzedna") ||
    highway.includes("tertiary")
  ) {

    return {
      color: "#626d79",
      width: 4
    };

  }


  return {
    color: "#46515e",
    width: 3
  };

}


function drawRoads() {

  if (!state.data) {
    return;
  }


  const roads =
    getValue(state.data, [
      "drogi",
      "roads"
    ]);


  if (!Array.isArray(roads)) {

    console.warn(
      "Nie znaleziono tablicy drogi/drogi."
    );

    return;

  }


  for (const road of roads) {

    const geometry =
      getValue(road, [
        "geometria",
        "geometry",
        "coordinates"
      ]);


    if (
      !Array.isArray(geometry) ||
      geometry.length < 2
    ) {

      continue;

    }


    const style =
      getRoadStyle(road);


    ctx.beginPath();


    let firstPoint = true;


    for (const point of geometry) {

      const coords =
        getPointCoordinates(point);


      if (!coords) {
        continue;
      }


      const screen =
        geoToScreen(
          coords.lat,
          coords.lon
        );


      if (firstPoint) {

        ctx.moveTo(
          screen.x,
          screen.y
        );

        firstPoint = false;

      } else {

        ctx.lineTo(
          screen.x,
          screen.y
        );

      }

    }


    if (firstPoint) {
      continue;
    }


    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    ctx.strokeStyle =
      style.color;

    ctx.lineWidth =
      style.width;

    ctx.stroke();

  }

}


/* =========================================
   MIEJSCOWOŚCI
========================================= */

function drawPlaces() {

  if (!state.data) {
    return;
  }


  const places =
    getValue(state.data, [
      "miejsca",
      "places"
    ]);


  if (!Array.isArray(places)) {

    console.warn(
      "Nie znaleziono tablicy miejsca."
    );

    return;

  }


  for (const place of places) {

    const coords =
      getPlaceCoordinates(place);


    if (!coords) {
      continue;
    }


    const screen =
      geoToScreen(
        coords.lat,
        coords.lon
      );


    /*
      Pomijamy bardzo odległe punkty.
    */

    if (
      screen.x < -500 ||
      screen.x > state.width + 500 ||
      screen.y < -500 ||
      screen.y > state.height + 500
    ) {

      continue;

    }


    /*
      Punkt.
    */

    ctx.beginPath();

    ctx.arc(
      screen.x,
      screen.y,
      5,
      0,
      Math.PI * 2
    );

    ctx.fillStyle =
      "#4f8cff";

    ctx.fill();


    /*
      Środek.
    */

    ctx.beginPath();

    ctx.arc(
      screen.x,
      screen.y,
      2,
      0,
      Math.PI * 2
    );

    ctx.fillStyle =
      "#ffffff";

    ctx.fill();


    /*
      Nazwa.
    */

    const name =
      getValue(place, [
        "nazwa",
        "name"
      ]) || "Nieznane";


    ctx.font =
      "600 14px Inter, system-ui, sans-serif";

    ctx.textAlign =
      "center";

    ctx.textBaseline =
      "top";

    ctx.fillStyle =
      "#f1f5f9";

    ctx.shadowColor =
      "rgba(0,0,0,0.85)";

    ctx.shadowBlur = 5;

    ctx.fillText(
      name,
      screen.x,
      screen.y + 10
    );

    ctx.shadowBlur = 0;

  }

}


/* =========================================
   RENDER
========================================= */

function render() {

  drawBackground();

  drawRoads();

  drawPlaces();

  updateCoordinates();

}


/* =========================================
   COORDINATES
========================================= */

function updateCoordinates() {

  const geo =
    screenToGeo(
      state.mouseX,
      state.mouseY
    );


  coordinatesElement.textContent =
    `${geo.lat.toFixed(6)}° N · ` +
    `${geo.lon.toFixed(6)}° E`;

}


/* =========================================
   MOUSE
========================================= */

canvas.addEventListener(
  "mousedown",
  event => {

    state.dragging = true;

    state.lastMouseX =
      event.clientX;

    state.lastMouseY =
      event.clientY;

    canvas.classList.add(
      "dragging"
    );

  }
);


window.addEventListener(
  "mouseup",
  () => {

    state.dragging = false;

    canvas.classList.remove(
      "dragging"
    );

  }
);


canvas.addEventListener(
  "mousemove",
  event => {

    state.mouseX =
      event.clientX;

    state.mouseY =
      event.clientY;


    if (state.dragging) {

      const dx =
        event.clientX -
        state.lastMouseX;

      const dy =
        event.clientY -
        state.lastMouseY;


      state.centerLon -=
        dx / state.zoom;

      state.centerLat +=
        dy / state.zoom;


      state.lastMouseX =
        event.clientX;

      state.lastMouseY =
        event.clientY;


      render();

    } else {

      updateCoordinates();

    }

  }
);


/* =========================================
   ZOOM
========================================= */

canvas.addEventListener(
  "wheel",
  event => {

    event.preventDefault();


    const before =
      screenToGeo(
        event.clientX,
        event.clientY
      );


    const factor =
      event.deltaY < 0
        ? 1.15
        : 1 / 1.15;


    state.zoom =
      Math.max(
        1000,
        Math.min(
          1000000,
          state.zoom * factor
        )
      );


    const after =
      screenToGeo(
        event.clientX,
        event.clientY
      );


    state.centerLon +=
      before.lon -
      after.lon;


    state.centerLat +=
      before.lat -
      after.lat;


    render();

  },
  {
    passive: false
  }
);


/* =========================================
   ZOOM BUTTONS
========================================= */

document
  .getElementById("zoomIn")
  .addEventListener(
    "click",
    () => {

      state.zoom *= 1.25;

      state.zoom =
        Math.min(
          state.zoom,
          1000000
        );

      render();

    }
  );


document
  .getElementById("zoomOut")
  .addEventListener(
    "click",
    () => {

      state.zoom /= 1.25;

      state.zoom =
        Math.max(
          state.zoom,
          1000
        );

      render();

    }
  );


/* =========================================
   GEOLOCATION
========================================= */

document
  .getElementById("locationButton")
  .addEventListener(
    "click",
    () => {

      if (!navigator.geolocation) {

        alert(
          "Geolokalizacja nie jest obsługiwana."
        );

        return;

      }


      navigator.geolocation.getCurrentPosition(

        position => {

          state.centerLat =
            position.coords.latitude;

          state.centerLon =
            position.coords.longitude;

          render();

        },

        () => {

          alert(
            "Nie udało się pobrać lokalizacji."
          );

        }

      );

    }
  );


/* =========================================
   SEARCH
========================================= */

searchInput.addEventListener(
  "keydown",
  event => {

    if (event.key !== "Enter") {
      return;
    }


    const query =
      searchInput.value
        .trim()
        .toLowerCase();


    if (!query || !state.data) {
      return;
    }


    const places =
      getValue(state.data, [
        "miejsca",
        "places"
      ]);


    if (!Array.isArray(places)) {
      return;
    }


    const result =
      places.find(place => {

        const name =
          String(
            getValue(place, [
              "nazwa",
              "name"
            ]) || ""
          ).toLowerCase();


        return name.includes(query);

      });


    if (!result) {

      alert(
        "KVGDV Maps: nie znaleziono miejsca."
      );

      return;

    }


    const coords =
      getPlaceCoordinates(result);


    if (!coords) {
      return;
    }


    state.centerLat =
      coords.lat;

    state.centerLon =
      coords.lon;


    placeName.textContent =
      getValue(result, [
        "nazwa",
        "name"
      ]) || "Nieznane";


    placeType.textContent =
      getValue(result, [
        "typ",
        "type"
      ]) || "Miejsce";


    placeCard.classList.add(
      "visible"
    );


    render();


    clearTimeout(
      window.placeCardTimer
    );


    window.placeCardTimer =
      setTimeout(
        () => {

          placeCard.classList.remove(
            "visible"
          );

        },
        3000
      );

  }
);


/* =========================================
   CTRL + K
========================================= */

document.addEventListener(
  "keydown",
  event => {

    if (
      (
        event.ctrlKey ||
        event.metaKey
      ) &&
      event.key.toLowerCase() === "k"
    ) {

      event.preventDefault();

      searchInput.focus();

    }

  }
);


/* =========================================
   LOAD JSON
========================================= */

async function loadMapData() {

  try {

    engineStatus.textContent =
      "Ładowanie KVGDV Map Data...";


    /*
      index.html znajduje się w głównym
      katalogu repozytorium.

      JSON:

      data/zachodniopomorskie.json
    */

    const response =
      await fetch(
        "./data/zachodniopomorskie.json",
        {
          cache: "no-cache"
        }
      );


    if (!response.ok) {

      throw new Error(
        "HTTP " +
        response.status +
        " — JSON nie został znaleziony."
      );

    }


    state.data =
      await response.json();


    console.log(
      "KVGDV JSON:",
      state.data
    );


    /*
      Szukamy miejsc.
    */

    const places =
      getValue(state.data, [
        "miejsca",
        "places"
      ]);


    /*
      Szukamy dróg.
    */

    const roads =
      getValue(state.data, [
        "drogi",
        "roads"
      ]);


    const placesCount =
      Array.isArray(places)
        ? places.length
        : 0;


    const roadsCount =
      Array.isArray(roads)
        ? roads.length
        : 0;


    console.log(
      "Miejsca:",
      placesCount
    );


    console.log(
      "Drogi:",
      roadsCount
    );


    /*
      Jeżeli znaleziono miejscowości,
      ustawiamy mapę na pierwszą.
    */

    if (
      placesCount > 0
    ) {

      const first =
        places[0];


      const coords =
        getPlaceCoordinates(first);


      if (coords) {

        state.centerLat =
          coords.lat;

        state.centerLon =
          coords.lon;

      }

    }


    engineStatus.textContent =
      "KVGDV Maps Engine · " +
      placesCount +
      " miejsc · " +
      roadsCount +
      " dróg";


    render();

  }


  catch (error) {

    console.error(
      "KVGDV Maps:",
      error
    );


    engineStatus.textContent =
      "KVGDV Maps Engine · błąd danych";


    ctx.fillStyle =
      "#10161d";


    ctx.fillRect(
      0,
      0,
      state.width,
      state.height
    );


    ctx.textAlign =
      "center";


    ctx.fillStyle =
      "#ff5c5c";


    ctx.font =
      "700 18px system-ui";


    ctx.fillText(
      "Nie udało się załadować mapy",
      state.width / 2,
      state.height / 2 - 20
    );


    ctx.fillStyle =
      "#8b98a8";


    ctx.font =
      "13px system-ui";


    ctx.fillText(
      error.message,
      state.width / 2,
      state.height / 2 + 10
    );

  }

}


/* =========================================
   START
========================================= */

resizeCanvas();

loadMapData();

</script>
