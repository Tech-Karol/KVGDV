<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0f14">
  <meta name="description" content="KVGDV Maps — własna platforma mapowa">

  <title>KVGDV Maps</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0b0f14;
      --panel: rgba(17, 22, 29, 0.94);
      --panel-2: #151b23;
      --border: rgba(255, 255, 255, 0.09);
      --text: #f1f5f9;
      --muted: #8b98a8;
      --accent: #4f8cff;
      --accent-hover: #6b9eff;
      --danger: #ff5c5c;
      --shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    /* =========================
       MAP
    ========================= */

    #map {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 45%, rgba(45, 57, 72, 0.35), transparent 42%),
        #10161d;
    }

    .map-grid {
      position: absolute;
      inset: -100px;
      opacity: 0.65;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 80px 80px;
      transform: rotate(0deg);
    }

    .map-land {
      position: absolute;
      width: 850px;
      height: 620px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) rotate(-7deg);
      border-radius: 46% 54% 52% 48% / 48% 43% 57% 52%;
      background: #1a222b;
      box-shadow:
        inset 0 0 80px rgba(0,0,0,0.18),
        0 0 100px rgba(0,0,0,0.12);
    }

    .road {
      position: absolute;
      height: 5px;
      background: #3b4652;
      border-radius: 99px;
      transform-origin: left center;
      opacity: 0.9;
    }

    .road::after {
      content: "";
      position: absolute;
      inset: 1px 0;
      border-radius: inherit;
      background: rgba(255,255,255,0.08);
    }

    .road.main {
      height: 8px;
      background: #697584;
    }

    .road.r1 {
      width: 720px;
      left: 8%;
      top: 28%;
      transform: rotate(13deg);
    }

    .road.r2 {
      width: 680px;
      left: 15%;
      top: 63%;
      transform: rotate(-19deg);
    }

    .road.r3 {
      width: 540px;
      left: 36%;
      top: 12%;
      transform: rotate(72deg);
    }

    .road.r4 {
      width: 420px;
      left: 48%;
      top: 80%;
      transform: rotate(-71deg);
    }

    .road.r5 {
      width: 500px;
      left: 2%;
      top: 50%;
      transform: rotate(2deg);
    }

    .road.r6 {
      width: 340px;
      left: 62%;
      top: 35%;
      transform: rotate(45deg);
    }

    .road.small {
      height: 3px;
      background: #313b46;
    }

    .road.r7 {
      width: 300px;
      left: 18%;
      top: 38%;
      transform: rotate(50deg);
    }

    .road.r8 {
      width: 280px;
      left: 53%;
      top: 56%;
      transform: rotate(15deg);
    }

    .road.r9 {
      width: 250px;
      left: 36%;
      top: 72%;
      transform: rotate(32deg);
    }

    .water {
      position: absolute;
      width: 900px;
      height: 230px;
      left: 50%;
      top: 76%;
      transform: translateX(-50%) rotate(-5deg);
      background: #111c27;
      border-radius: 50%;
      opacity: 0.85;
    }

    /* =========================
       TOP BAR
    ========================= */

    .topbar {
      position: fixed;
      z-index: 20;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: none;
    }

    .topbar > * {
      pointer-events: auto;
    }

    .brand {
      height: 52px;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 0 17px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 15px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .brand-icon {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      background: var(--accent);
      font-size: 15px;
      font-weight: 800;
    }

    .brand-name {
      font-weight: 750;
      letter-spacing: -0.3px;
      white-space: nowrap;
    }

    .search {
      height: 52px;
      width: min(500px, 48vw);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 15px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 15px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .search-icon {
      color: var(--muted);
      font-size: 19px;
    }

    .search input {
      width: 100%;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--text);
      font-size: 14px;
    }

    .search input::placeholder {
      color: #748090;
    }

    .search-shortcut {
      padding: 4px 7px;
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }

    /* =========================
       LEFT PANEL
    ========================= */

    .left-panel {
      position: fixed;
      z-index: 15;
      top: 84px;
      left: 16px;
      width: 270px;
      padding: 10px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 17px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .panel-section {
      padding: 8px;
    }

    .panel-title {
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .tool {
      width: 100%;
      min-height: 43px;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 0 11px;
      border-radius: 11px;
      background: transparent;
      color: var(--text);
      text-align: left;
      transition: 0.15s ease;
    }

    .tool:hover {
      background: rgba(255,255,255,0.06);
    }

    .tool.active {
      background: rgba(79,140,255,0.13);
      color: #9cbdff;
    }

    .tool-icon {
      width: 25px;
      text-align: center;
      font-size: 17px;
    }

    .tool-text {
      font-size: 13px;
      font-weight: 550;
    }

    /* =========================
       RIGHT CONTROLS
    ========================= */

    .map-controls {
      position: fixed;
      z-index: 15;
      right: 16px;
      bottom: 104px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .control-group {
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 13px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .map-btn {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      background: transparent;
      color: var(--text);
      font-size: 18px;
      transition: 0.15s ease;
    }

    .map-btn:hover {
      background: rgba(255,255,255,0.07);
    }

    .divider {
      height: 1px;
      background: var(--border);
    }

    /* =========================
       BOTTOM BAR
    ========================= */

    .bottom-bar {
      position: fixed;
      z-index: 20;
      left: 16px;
      right: 16px;
      bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .bottom-bar > * {
      pointer-events: auto;
    }

    .status {
      height: 44px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 13px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      color: var(--muted);
      font-size: 12px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #47d18c;
      box-shadow: 0 0 10px rgba(71,209,140,0.6);
    }

    .coordinates {
      height: 44px;
      display: flex;
      align-items: center;
      padding: 0 13px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    /* =========================
       LOCATION BUTTON
    ========================= */

    .location-btn {
      position: fixed;
      z-index: 15;
      right: 16px;
      bottom: 16px;
      width: 46px;
      height: 46px;
      border-radius: 13px;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      font-size: 18px;
    }

    .location-btn:hover {
      background: rgba(255,255,255,0.08);
    }

    /* =========================
       MAP MARKER
    ========================= */

    .marker {
      position: absolute;
      z-index: 5;
      left: 55%;
      top: 47%;
      width: 38px;
      height: 38px;
      transform: translate(-50%, -100%);
      border-radius: 50% 50% 50% 0;
      rotate: -45deg;
      background: var(--accent);
      box-shadow: 0 8px 25px rgba(0,0,0,0.35);
    }

    .marker::after {
      content: "";
      position: absolute;
      width: 12px;
      height: 12px;
      left: 13px;
      top: 13px;
      border-radius: 50%;
      background: #fff;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 760px) {
      .topbar {
        left: 10px;
        right: 10px;
        top: 10px;
      }

      .brand {
        padding: 0 13px;
      }

      .brand-name {
        display: none;
      }

      .search {
        width: 100%;
      }

      .left-panel {
        display: none;
      }

      .bottom-bar {
        left: 10px;
        right: 10px;
        bottom: 10px;
      }

      .map-controls {
        right: 10px;
        bottom: 68px;
      }

      .location-btn {
        right: 10px;
        bottom: 10px;
      }

      .coordinates {
        display: none;
      }

      .map-land {
        width: 700px;
        height: 500px;
      }
    }
  </style>
</head>

<body>

  <!-- MAP -->
  <main id="map">
    <div class="map-grid"></div>

    <div class="map-land">

      <div class="water"></div>

      <div class="road main r1"></div>
      <div class="road main r2"></div>
      <div class="road main r3"></div>
      <div class="road main r4"></div>
      <div class="road main r5"></div>
      <div class="road main r6"></div>

      <div class="road small r7"></div>
      <div class="road small r8"></div>
      <div class="road small r9"></div>

    </div>

    <div class="marker"></div>
  </main>

  <!-- TOP -->
  <header class="topbar">

    <div class="brand">
      <div class="brand-icon">K</div>
      <div class="brand-name">KVGDV Maps</div>
    </div>

    <div class="search">
      <div class="search-icon">⌕</div>

      <input
        id="searchInput"
        type="search"
        placeholder="Szukaj miejsca, adresu lub współrzędnych..."
        autocomplete="off"
      >

      <div class="search-shortcut">Ctrl K</div>
    </div>

  </header>

  <!-- LEFT MENU -->
  <aside class="left-panel">

    <div class="panel-section">

      <div class="panel-title">
        Mapa
      </div>

      <button class="tool active">
        <span class="tool-icon">🗺️</span>
        <span class="tool-text">Mapa standardowa</span>
      </button>

      <button class="tool">
        <span class="tool-icon">🛰️</span>
        <span class="tool-text">Satelita</span>
      </button>

      <button class="tool">
        <span class="tool-icon">⛰️</span>
        <span class="tool-text">Teren</span>
      </button>

    </div>

    <div class="panel-section">

      <div class="panel-title">
        Narzędzia
      </div>

      <button class="tool">
        <span class="tool-icon">📍</span>
        <span class="tool-text">Dodaj punkt</span>
      </button>

      <button class="tool">
        <span class="tool-icon">🧭</span>
        <span class="tool-text">Wyznacz trasę</span>
      </button>

      <button class="tool">
        <span class="tool-icon">📏</span>
        <span class="tool-text">Zmierz odległość</span>
      </button>

    </div>

  </aside>

  <!-- MAP CONTROLS -->
  <div class="map-controls">

    <div class="control-group">

      <button class="map-btn" id="zoomIn" title="Przybliż">
        +
      </button>

      <div class="divider"></div>

      <button class="map-btn" id="zoomOut" title="Oddal">
        −
      </button>

    </div>

    <div class="control-group">

      <button class="map-btn" title="Warstwy">
        ◈
      </button>

    </div>

  </div>

  <!-- LOCATION -->
  <button
    class="location-btn"
    id="locationButton"
    title="Moja lokalizacja"
  >
    ◎
  </button>

  <!-- BOTTOM -->
  <footer class="bottom-bar">

    <div class="status">
      <span class="status-dot"></span>
      KVGDV Maps Engine — offline
    </div>

    <div class="coordinates" id="coordinates">
      53.12345° N · 15.67890° E
    </div>

  </footer>

  <script>
    const searchInput = document.getElementById("searchInput");
    const coordinates = document.getElementById("coordinates");
    const map = document.getElementById("map");

    /* Ctrl + K */
    document.addEventListener("keydown", (event) => {
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "k") {
        event.preventDefault();
        searchInput.focus();
      }
    });

    /* Zoom prototype */
    let zoom = 1;

    document.getElementById("zoomIn").addEventListener("click", () => {
      zoom = Math.min(zoom + 0.15, 2);
      map.style.transform = `scale(${zoom})`;
    });

    document.getElementById("zoomOut").addEventListener("click", () => {
      zoom = Math.max(zoom - 0.15, 0.75);
      map.style.transform = `scale(${zoom})`;
    });

    /* Geolocation */
    document.getElementById("locationButton").addEventListener("click", () => {

      if (!navigator.geolocation) {
        alert("Geolokalizacja nie jest obsługiwana przez tę przeglądarkę.");
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const lat = position.coords.latitude.toFixed(5);
          const lon = position.coords.longitude.toFixed(5);

          coordinates.textContent = `${lat}° · ${lon}°`;
        },
        () => {
          alert("Nie udało się pobrać lokalizacji.");
        }
      );

    });

    /* Fake search for UI prototype */
    searchInput.addEventListener("keydown", (event) => {

      if (event.key !== "Enter") {
        return;
      }

      const query = searchInput.value.trim();

      if (!query) {
        return;
      }

      console.log("KVGDV Maps search:", query);

      alert(
        "KVGDV Maps\n\n" +
        "Wyszukiwanie zostanie podłączone do KVGDV Maps API."
      );

    });
  </script>

</body>
</html>
