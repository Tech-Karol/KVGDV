<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0f14">

<title>KVGDV AI 0.4</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #0b0f14;
    --panel: rgba(17,22,29,.95);
    --panel2: #151b23;
    --border: rgba(255,255,255,.09);
    --text: #f1f5f9;
    --muted: #8b98a8;
    --accent: #4f8cff;
    --accent-hover: #6b9eff;
    --user: #1b2636;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;

    font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background:
        radial-gradient(
            circle at 50% 15%,
            rgba(79,140,255,.08),
            transparent 35%
        ),
        var(--bg);

    color: var(--text);
}


/* =========================================
   APP
========================================= */

.app {
    width: 100%;
    height: 100vh;

    display: flex;
    flex-direction: column;
}


/* =========================================
   HEADER
========================================= */

.header {
    height: 64px;
    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 22px;

    background: rgba(11,15,20,.9);

    border-bottom: 1px solid var(--border);

    backdrop-filter: blur(20px);
}

.brand {
    display: flex;
    align-items: center;
    gap: 11px;
}

.logo {
    width: 34px;
    height: 34px;

    display: grid;
    place-items: center;

    border-radius: 10px;

    background: var(--accent);

    font-weight: 800;

    box-shadow:
        0 0 22px rgba(79,140,255,.25);
}

.brand-name {
    font-size: 15px;
    font-weight: 750;
}

.brand-version {
    margin-top: 1px;

    color: var(--muted);

    font-size: 10px;
}

.new-chat {
    height: 38px;

    padding: 0 13px;

    border: 1px solid var(--border);
    border-radius: 10px;

    background: rgba(255,255,255,.035);

    color: var(--text);

    cursor: pointer;

    transition: .15s;
}

.new-chat:hover {
    background: rgba(255,255,255,.08);
}


/* =========================================
   CHAT
========================================= */

.chat {
    flex: 1;

    overflow-y: auto;
}

.chat-inner {
    width: min(900px, 100%);

    margin: auto;

    padding:
        35px 20px
        150px;
}


/* =========================================
   WELCOME
========================================= */

.welcome {
    min-height: 65vh;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;
}

.welcome-logo {
    width: 64px;
    height: 64px;

    display: grid;
    place-items: center;

    margin-bottom: 20px;

    border-radius: 18px;

    background: var(--accent);

    font-size: 27px;
    font-weight: 800;

    box-shadow:
        0 0 40px rgba(79,140,255,.2);
}

.welcome h1 {
    margin-bottom: 10px;

    font-size: 30px;

    letter-spacing: -.7px;
}

.welcome p {
    max-width: 570px;

    color: var(--muted);

    font-size: 14px;

    line-height: 1.6;
}

.examples {
    display: flex;
    flex-wrap: wrap;

    justify-content: center;

    gap: 8px;

    margin-top: 25px;
}

.example {
    padding: 10px 13px;

    border: 1px solid var(--border);
    border-radius: 11px;

    background: rgba(255,255,255,.035);

    color: #cbd5e1;

    cursor: pointer;

    font-size: 12px;

    transition: .15s;
}

.example:hover {
    background: rgba(255,255,255,.08);
}


/* =========================================
   MESSAGE
========================================= */

.message {
    display: flex;

    gap: 13px;

    margin-bottom: 28px;
}

.avatar {
    width: 34px;
    height: 34px;

    flex-shrink: 0;

    display: grid;
    place-items: center;

    border-radius: 10px;

    font-size: 12px;
    font-weight: 750;
}

.message.user .avatar {
    background: #263449;
}

.message.ai .avatar {
    background: var(--accent);
}

.message-content {
    flex: 1;
    min-width: 0;
}

.message-name {
    margin-bottom: 6px;

    color: var(--muted);

    font-size: 11px;
    font-weight: 650;
}

.message-text {
    color: #e7edf5;

    font-size: 14px;

    line-height: 1.7;

    white-space: pre-wrap;

    overflow-wrap: anywhere;
}

.message.user .message-text {
    display: inline-block;

    padding: 11px 14px;

    border: 1px solid rgba(255,255,255,.05);

    border-radius: 13px;

    background: var(--user);
}


/* =========================================
   LINK
========================================= */

.detected-link {
    display: inline-block;

    max-width: 100%;

    margin-top: 9px;

    padding: 8px 10px;

    border: 1px solid rgba(79,140,255,.2);

    border-radius: 9px;

    background: rgba(79,140,255,.07);

    color: #9cbdff;

    font-size: 12px;

    text-decoration: none;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;
}


/* =========================================
   ACTIONS
========================================= */

.message-actions {
    display: flex;

    gap: 6px;

    margin-top: 7px;
}

.message-action {
    padding: 5px 7px;

    border: 0;
    border-radius: 7px;

    background: transparent;

    color: #718096;

    cursor: pointer;

    font-size: 11px;
}

.message-action:hover {
    background: rgba(255,255,255,.05);

    color: var(--text);
}


/* =========================================
   LEARNING CARD
========================================= */

.learning {
    margin-top: 12px;

    padding: 13px;

    border: 1px solid rgba(79,140,255,.2);

    border-radius: 12px;

    background: rgba(79,140,255,.06);
}

.learning-title {
    margin-bottom: 8px;

    color: #9cbdff;

    font-size: 12px;
    font-weight: 700;
}

.learning-text {
    margin-bottom: 10px;

    color: var(--muted);

    font-size: 11px;

    line-height: 1.5;
}

.learning-button {
    padding: 8px 11px;

    border: 0;
    border-radius: 8px;

    background: var(--accent);

    color: white;

    cursor: pointer;

    font-size: 11px;
}

.learning-button:hover {
    background: var(--accent-hover);
}


/* =========================================
   INPUT
========================================= */

.input-area {
    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    padding:
        15px
        20px
        20px;

    background:
        linear-gradient(
            to top,
            var(--bg) 65%,
            transparent
        );
}

.input-wrap {
    width: min(900px, 100%);

    margin: auto;
}

.input-box {
    display: flex;

    align-items: flex-end;

    gap: 10px;

    min-height: 58px;

    padding:
        9px
        9px
        9px
        15px;

    border: 1px solid rgba(255,255,255,.12);

    border-radius: 17px;

    background: rgba(17,22,29,.97);

    box-shadow:
        0 15px 45px rgba(0,0,0,.35);

    backdrop-filter: blur(20px);
}

.input-box:focus-within {
    border-color:
        rgba(79,140,255,.45);

    box-shadow:
        0 15px 45px rgba(0,0,0,.35),
        0 0 0 3px rgba(79,140,255,.08);
}

textarea {
    flex: 1;

    width: 100%;

    min-height: 38px;
    max-height: 180px;

    resize: none;

    border: 0;
    outline: 0;

    background: transparent;

    color: var(--text);

    font-family: inherit;

    font-size: 14px;

    line-height: 1.5;
}

textarea::placeholder {
    color: #687586;
}

.send {
    width: 40px;
    height: 40px;

    flex-shrink: 0;

    display: grid;
    place-items: center;

    border: 0;
    border-radius: 11px;

    background: var(--accent);

    color: white;

    cursor: pointer;

    font-size: 17px;

    transition: .15s;
}

.send:hover {
    background: var(--accent-hover);

    transform: translateY(-1px);
}

.send:disabled {
    opacity: .35;

    cursor: default;

    transform: none;
}

.input-info {
    margin-top: 8px;

    text-align: center;

    color: #657181;

    font-size: 10px;
}


/* =========================================
   TYPING
========================================= */

.typing {
    display: flex;

    align-items: center;

    gap: 5px;

    height: 25px;
}

.typing span {
    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: #7e8da1;

    animation: typing 1.2s infinite;
}

.typing span:nth-child(2) {
    animation-delay: .15s;
}

.typing span:nth-child(3) {
    animation-delay: .3s;
}

@keyframes typing {

    0%, 60%, 100% {
        transform: translateY(0);
        opacity: .4;
    }

    30% {
        transform: translateY(-4px);
        opacity: 1;
    }

}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 700px) {

    .header {
        height: 58px;

        padding: 0 12px;
    }

    .chat-inner {
        padding:
            25px
            13px
            140px;
    }

    .welcome h1 {
        font-size: 25px;
    }

    .message {
        gap: 9px;
    }

    .avatar {
        width: 31px;
        height: 31px;
    }

    .message-text {
        font-size: 13px;
    }

    .input-area {
        padding:
            10px
            10px
            13px;
    }

}

</style>
</head>


<body>

<div class="app">


    <!-- HEADER -->

    <header class="header">

        <div class="brand">

            <div class="logo">
                K
            </div>

            <div>

                <div class="brand-name">
                    KVGDV AI
                </div>

                <div class="brand-version">
                    Local Brain · 0.4
                </div>

            </div>

        </div>


        <button
            class="new-chat"
            id="newChat"
        >
            ＋ Nowa rozmowa
        </button>

    </header>


    <!-- CHAT -->

    <main
        class="chat"
        id="chat"
    >

        <div
            class="chat-inner"
            id="chatInner"
        >

            <section
                class="welcome"
                id="welcome"
            >

                <div class="welcome-logo">
                    K
                </div>

                <h1>
                    W czym mogę pomóc?
                </h1>

                <p>
                    KVGDV AI 0.4 korzysta z lokalnej
                    bazy wiedzy. Możesz normalnie
                    prowadzić rozmowę i podawać linki.
                </p>


                <div class="examples">

                    <button
                        class="example"
                        data-text="Cześć"
                    >
                        Cześć 👋
                    </button>

                    <button
                        class="example"
                        data-text="Kim jesteś?"
                    >
                        Kim jesteś?
                    </button>

                    <button
                        class="example"
                        data-text="Co potrafisz?"
                    >
                        Co potrafisz?
                    </button>

                    <button
                        class="example"
                        data-text="Czym jest HTML?"
                    >
                        Czym jest HTML?
                    </button>

                </div>

            </section>

        </div>

    </main>


    <!-- INPUT -->

    <div class="input-area">

        <div class="input-wrap">

            <div class="input-box">

                <textarea
                    id="messageInput"
                    rows="1"
                    placeholder="Napisz wiadomość..."
                    autocomplete="off"
                ></textarea>


                <button
                    class="send"
                    id="sendButton"
                    title="Wyślij"
                >
                    ↑
                </button>

            </div>


            <div class="input-info">
                Enter — wyślij · Shift + Enter — nowa linia
            </div>

        </div>

    </div>

</div>


<script>

/* =========================================
   KVGDV AI 0.4
   LOCAL BRAIN
========================================= */


const chat =
    document.getElementById("chat");

const chatInner =
    document.getElementById("chatInner");

const input =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const newChat =
    document.getElementById("newChat");

const welcome =
    document.getElementById("welcome");


let knowledge = [];

let messages =
    JSON.parse(
        localStorage.getItem(
            "kvgdv_ai_messages"
        ) || "[]"
    );


/* =========================================
   LOAD KNOWLEDGE.JSON
========================================= */

async function loadKnowledge() {

    try {

        const response =
            await fetch(
                "./data/knowledge.json"
            );

        if (!response.ok) {

            throw new Error(
                "Nie można załadować knowledge.json"
            );

        }

        const data =
            await response.json();

        knowledge =
            Array.isArray(data.knowledge)
                ? data.knowledge
                : [];

        console.log(
            "KVGDV AI: załadowano",
            knowledge.length,
            "wpisów wiedzy."
        );

    } catch (error) {

        console.error(
            "KVGDV AI:",
            error
        );

        knowledge = [];

    }

}


/* =========================================
   NORMALIZE
========================================= */

function normalize(text) {

    return text
        .toLowerCase()
        .normalize("NFD")
        .replace(
            /[\u0300-\u036f]/g,
            ""
        )
        .replace(
            /[^a-z0-9ąćęłńóśźż\s]/gi,
            " "
        )
        .replace(
            /\s+/g,
            " "
        )
        .trim();

}


/* =========================================
   URL
========================================= */

function findURL(text) {

    const match =
        text.match(
            /https?:\/\/[^\s]+/i
        );

    if (!match) {
        return null;
    }

    return match[0].replace(
        /[.,!?;:)\]]+$/,
        ""
    );

}


/* =========================================
   SIMILARITY
========================================= */

function calculateScore(
    question,
    userText
) {

    const a =
        normalize(question);

    const b =
        normalize(userText);


    if (!a || !b) {
        return 0;
    }


    if (a === b) {
        return 100;
    }


    if (
        b.includes(a) ||
        a.includes(b)
    ) {

        return 80;

    }


    const wordsA =
        new Set(a.split(" "));

    const wordsB =
        new Set(b.split(" "));


    let matches = 0;


    wordsA.forEach(word => {

        if (
            word.length > 2 &&
            wordsB.has(word)
        ) {

            matches++;

        }

    });


    if (!matches) {
        return 0;
    }


    return (
        matches /
        Math.max(
            wordsA.size,
            wordsB.size
        )
    ) * 100;

}


/* =========================================
   FIND ANSWER
========================================= */

function findKnowledgeAnswer(text) {

    let best = null;

    let bestScore = 0;


    for (
        const item of knowledge
    ) {

        if (
            !Array.isArray(
                item.questions
            )
        ) {
            continue;
        }


        for (
            const question of item.questions
        ) {

            const score =
                calculateScore(
                    question,
                    text
                );


            if (
                score > bestScore
            ) {

                bestScore =
                    score;

                best =
                    item;

            }

        }

    }


    /*
       Próg dopasowania.
       Możesz go później zmienić.
    */

    if (
        best &&
        bestScore >= 35
    ) {

        return {
            answer: best.answer,
            score: bestScore,
            item: best
        };

    }


    return null;

}


/* =========================================
   ESCAPE
========================================= */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text;

    return div.innerHTML;

}


/* =========================================
   ADD MESSAGE
========================================= */

function addMessage(
    role,
    text,
    url = null
) {

    if (welcome) {
        welcome.style.display = "none";
    }


    const message =
        document.createElement("div");

    message.className =
        "message " + role;


    const avatar =
        document.createElement("div");

    avatar.className =
        "avatar";

    avatar.textContent =
        role === "user"
            ? "Ty"
            : "K";


    const content =
        document.createElement("div");

    content.className =
        "message-content";


    const name =
        document.createElement("div");

    name.className =
        "message-name";

    name.textContent =
        role === "user"
            ? "Ty"
            : "KVGDV AI";


    const textElement =
        document.createElement("div");

    textElement.className =
        "message-text";

    textElement.innerHTML =
        escapeHTML(text);


    content.appendChild(name);

    content.appendChild(textElement);


    if (url) {

        const link =
            document.createElement("a");

        link.className =
            "detected-link";

        link.href =
            url;

        link.target =
            "_blank";

        link.rel =
            "noopener noreferrer";

        link.textContent =
            "🔗 " + url;

        content.appendChild(link);

    }


    if (role === "ai") {

        const actions =
            document.createElement("div");

        actions.className =
            "message-actions";


        const copy =
            document.createElement("button");

        copy.className =
            "message-action";

        copy.textContent =
            "Kopiuj";


        copy.onclick = () => {

            navigator.clipboard.writeText(
                text
            );

            copy.textContent =
                "Skopiowano ✓";


            setTimeout(() => {

                copy.textContent =
                    "Kopiuj";

            }, 1500);

        };


        actions.appendChild(copy);

        content.appendChild(actions);

    }


    message.appendChild(avatar);

    message.appendChild(content);

    chatInner.appendChild(message);


    chat.scrollTop =
        chat.scrollHeight;

}


/* =========================================
   TYPING
========================================= */

function showTyping() {

    const message =
        document.createElement("div");

    message.id =
        "typing";

    message.className =
        "message ai";


    message.innerHTML = `

        <div class="avatar">
            K
        </div>

        <div class="message-content">

            <div class="message-name">
                KVGDV AI
            </div>

            <div class="typing">
                <span></span>
                <span></span>
                <span></span>
            </div>

        </div>

    `;


    chatInner.appendChild(message);

    chat.scrollTop =
        chat.scrollHeight;

}


function hideTyping() {

    const element =
        document.getElementById(
            "typing"
        );

    if (element) {
        element.remove();
    }

}


/* =========================================
   RESPONSE
========================================= */

function generateResponse(text) {

    const url =
        findURL(text);


    /*
       Najpierw szukamy wiedzy.
    */

    const result =
        findKnowledgeAnswer(text);


    if (result) {

        return result.answer;

    }


    /*
       Obsługa linku.
    */

    if (url) {

        return (
            "Wykryłem link:\n\n" +
            url +
            "\n\n" +

            "Na razie potrafię rozpoznać link, " +
            "ale nie mam jeszcze backendu, który " +
            "pobiera jego zawartość. Możemy dodać " +
            "to w następnej wersji."
        );

    }


    /*
       Brak wiedzy.
    */

    return (
        "Nie mam jeszcze odpowiedzi na to pytanie " +
        "w mojej lokalnej bazie wiedzy.\n\n" +

        "Możesz mnie tego nauczyć w kolejnej " +
        "wersji KVGDV AI."
    );

}


/* =========================================
   SAVE CHAT
========================================= */

function saveMessages() {

    localStorage.setItem(
        "kvgdv_ai_messages",
        JSON.stringify(messages)
    );

}


/* =========================================
   SEND
========================================= */

async function sendMessage() {

    const text =
        input.value.trim();


    if (!text) {
        return;
    }


    const url =
        findURL(text);


    addMessage(
        "user",
        text,
        url
    );


    messages.push({
        role: "user",
        text: text,
        url: url,
        time: Date.now()
    });


    saveMessages();


    input.value = "";

    input.style.height =
        "38px";


    sendButton.disabled =
        true;


    showTyping();


    await new Promise(
        resolve =>
            setTimeout(
                resolve,
                450
            )
    );


    const answer =
        generateResponse(text);


    hideTyping();


    addMessage(
        "ai",
        answer
    );


    messages.push({
        role: "ai",
        text: answer,
        time: Date.now()
    });


    saveMessages();


    sendButton.disabled =
        false;

    input.focus();

}


/* =========================================
   ENTER
========================================= */

input.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =========================================
   AUTO RESIZE
========================================= */

input.addEventListener(
    "input",
    () => {

        input.style.height =
            "38px";

        input.style.height =
            Math.min(
                input.scrollHeight,
                180
            ) + "px";

    }
);


/* =========================================
   SEND BUTTON
========================================= */

sendButton.addEventListener(
    "click",
    sendMessage
);


/* =========================================
   EXAMPLES
========================================= */

function setupExamples() {

    document
        .querySelectorAll(".example")
        .forEach(button => {

            button.onclick = () => {

                input.value =
                    button.dataset.text;

                input.focus();

            };

        });

}


/* =========================================
   LOAD OLD CHAT
========================================= */

function loadMessages() {

    if (!messages.length) {
        return;
    }


    if (welcome) {
        welcome.style.display = "none";
    }


    messages.forEach(message => {

        addMessage(
            message.role,
            message.text,
            message.url || null
        );

    });

}


/* =========================================
   NEW CHAT
========================================= */

newChat.addEventListener(
    "click",
    () => {

        if (
            messages.length &&
            !confirm(
                "Rozpocząć nową rozmowę?"
            )
        ) {
            return;
        }


        messages = [];


        localStorage.removeItem(
            "kvgdv_ai_messages"
        );


        location.reload();

    }
);


/* =========================================
   START
========================================= */

async function start() {

    await loadKnowledge();

    loadMessages();

    setupExamples();

    input.focus();

}


start();

</script>

</body>
</html>
