<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0f14">

<title>KVGDV AI</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #0b0f14;
    --panel: #11161d;
    --panel2: #171d26;
    --border: rgba(255,255,255,.08);
    --text: #f1f5f9;
    --muted: #8995a5;
    --accent: #4f8cff;
    --accent2: #6b9eff;
    --danger: #ff5c5c;
    --user: #1d4ed8;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    background: var(--bg);
    color: var(--text);
}

button,
textarea {
    font: inherit;
}

button {
    cursor: pointer;
    border: 0;
}

/* =========================================
   APP
========================================= */

#app {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
}

/* =========================================
   HEADER
========================================= */

.header {
    height: 68px;
    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 22px;

    background: rgba(11,15,20,.94);
    border-bottom: 1px solid var(--border);

    backdrop-filter: blur(20px);
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo {
    width: 38px;
    height: 38px;

    display: grid;
    place-items: center;

    border-radius: 11px;

    background: var(--accent);

    color: white;
    font-weight: 800;
    font-size: 17px;

    box-shadow:
        0 0 25px rgba(79,140,255,.25);
}

.brand-text {
    display: flex;
    flex-direction: column;
}

.brand-name {
    font-size: 15px;
    font-weight: 750;
}

.brand-version {
    margin-top: 2px;

    color: var(--muted);
    font-size: 10px;
}

.header-status {
    display: flex;
    align-items: center;
    gap: 8px;

    color: var(--muted);
    font-size: 11px;
}

.status-dot {
    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: #47d18c;

    box-shadow:
        0 0 10px rgba(71,209,140,.6);
}

/* =========================================
   CHAT
========================================= */

.chat {
    flex: 1;

    overflow-y: auto;

    padding: 30px 18px 130px;
}

.chat-inner {
    width: min(850px, 100%);
    margin: 0 auto;
}

/* =========================================
   WELCOME
========================================= */

.welcome {
    min-height: 55vh;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    text-align: center;
}

.welcome-logo {
    width: 72px;
    height: 72px;

    display: grid;
    place-items: center;

    margin-bottom: 20px;

    border-radius: 22px;

    background: var(--accent);

    font-size: 30px;
    font-weight: 800;

    box-shadow:
        0 0 50px rgba(79,140,255,.22);
}

.welcome h1 {
    font-size: clamp(26px, 5vw, 40px);
    letter-spacing: -1px;
}

.welcome p {
    max-width: 520px;

    margin-top: 10px;

    color: var(--muted);

    font-size: 14px;
    line-height: 1.6;
}

.welcome-hint {
    margin-top: 25px;

    padding: 10px 14px;

    border: 1px solid var(--border);
    border-radius: 10px;

    background: var(--panel);

    color: var(--muted);

    font-size: 11px;
}

/* =========================================
   MESSAGE
========================================= */

.message {
    display: flex;
    gap: 12px;

    margin-bottom: 25px;
}

.message.user {
    justify-content: flex-end;
}

.message-avatar {
    width: 34px;
    height: 34px;
    flex-shrink: 0;

    display: grid;
    place-items: center;

    border-radius: 10px;

    background: var(--panel2);

    border: 1px solid var(--border);

    font-size: 13px;
    font-weight: 750;
}

.message.user .message-avatar {
    order: 2;

    background: var(--user);
    border-color: transparent;
}

.message-content {
    max-width: min(700px, 80%);

    padding: 12px 15px;

    border-radius: 15px;

    background: var(--panel);

    border: 1px solid var(--border);

    line-height: 1.55;
    font-size: 14px;

    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.message.user .message-content {
    background: var(--user);
    border-color: transparent;
}

/* =========================================
   LINKS
========================================= */

.message-content a {
    color: #9fc0ff;
    text-decoration: underline;
    text-underline-offset: 2px;
}

.message.user .message-content a {
    color: white;
}

/* =========================================
   TYPING
========================================= */

.typing {
    display: flex;
    gap: 5px;
    align-items: center;
}

.typing span {
    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: var(--muted);

    animation: typing 1s infinite;
}

.typing span:nth-child(2) {
    animation-delay: .15s;
}

.typing span:nth-child(3) {
    animation-delay: .3s;
}

@keyframes typing {
    0%, 60%, 100% {
        opacity: .25;
        transform: translateY(0);
    }

    30% {
        opacity: 1;
        transform: translateY(-3px);
    }
}

/* =========================================
   INPUT AREA
========================================= */

.input-area {
    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    padding: 15px 18px 18px;

    background:
        linear-gradient(
            to top,
            rgba(11,15,20,1) 45%,
            rgba(11,15,20,.85),
            transparent
        );

    pointer-events: none;
}

.input-container {
    width: min(850px, 100%);
    margin: 0 auto;

    pointer-events: auto;
}

.input-box {
    display: flex;
    align-items: flex-end;
    gap: 10px;

    padding: 10px;

    background: rgba(17,22,29,.96);

    border: 1px solid var(--border);
    border-radius: 17px;

    box-shadow:
        0 15px 50px rgba(0,0,0,.35);

    backdrop-filter: blur(20px);
}

#messageInput {
    width: 100%;
    min-height: 40px;
    max-height: 150px;

    padding: 9px 8px;

    resize: none;

    outline: none;
    border: 0;

    background: transparent;

    color: var(--text);

    font-size: 14px;
    line-height: 1.5;
}

#messageInput::placeholder {
    color: #718093;
}

.send-button {
    width: 42px;
    height: 42px;
    flex-shrink: 0;

    display: grid;
    place-items: center;

    border-radius: 12px;

    background: var(--accent);
    color: white;

    font-size: 18px;

    transition: .15s ease;
}

.send-button:hover {
    background: var(--accent2);
    transform: translateY(-1px);
}

.send-button:disabled {
    opacity: .4;
    cursor: not-allowed;
    transform: none;
}

.input-info {
    display: flex;
    justify-content: space-between;

    margin-top: 7px;
    padding: 0 5px;

    color: #667384;

    font-size: 10px;
}

/* =========================================
   NEW CHAT
========================================= */

.new-chat {
    position: fixed;

    top: 82px;
    right: 18px;

    z-index: 10;

    height: 38px;

    padding: 0 13px;

    display: flex;
    align-items: center;
    gap: 7px;

    border-radius: 10px;

    background: var(--panel);

    border: 1px solid var(--border);

    color: var(--muted);

    font-size: 11px;

    transition: .15s ease;
}

.new-chat:hover {
    color: var(--text);
    background: var(--panel2);
}

/* =========================================
   MOBILE
========================================= */

@media (max-width: 700px) {

    .header {
        height: 60px;
        padding: 0 12px;
    }

    .header-status {
        display: none;
    }

    .chat {
        padding:
            20px
            10px
            130px;
    }

    .message-content {
        max-width: 85%;
    }

    .new-chat {
        top: 70px;
        right: 10px;
    }

    .input-area {
        padding:
            10px
            10px
            12px;
    }

    .welcome {
        min-height: 60vh;
    }

    .welcome-logo {
        width: 62px;
        height: 62px;
    }
}
</style>
</head>

<body>

<div id="app">

    <!-- HEADER -->

    <header class="header">

        <div class="brand">

            <div class="logo">
                K
            </div>

            <div class="brand-text">

                <div class="brand-name">
                    KVGDV AI
                </div>

                <div class="brand-version">
                    Local Brain · v0.5
                </div>

            </div>

        </div>

        <div class="header-status">

            <span class="status-dot"></span>

            <span id="statusText">
                Ładowanie wiedzy...
            </span>

        </div>

    </header>


    <!-- NEW CHAT -->

    <button
        class="new-chat"
        id="newChatButton"
    >
        ＋
        Nowa rozmowa
    </button>


    <!-- CHAT -->

    <main
        class="chat"
        id="chat"
    >

        <div
            class="chat-inner"
            id="chatInner"
        >

            <!-- WELCOME -->

            <section
                class="welcome"
                id="welcome"
            >

                <div class="welcome-logo">
                    K
                </div>

                <h1>
                    KVGDV AI
                </h1>

                <p>
                    Twój lokalny eksperymentalny asystent AI.
                    Napisz wiadomość, zadaj pytanie albo wklej link.
                </p>

                <div class="welcome-hint">
                    Enter — wyślij · Shift + Enter — nowa linia
                </div>

            </section>

        </div>

    </main>


    <!-- INPUT -->

    <div class="input-area">

        <div class="input-container">

            <div class="input-box">

                <textarea
                    id="messageInput"
                    rows="1"
                    placeholder="Napisz wiadomość..."
                    autocomplete="off"
                ></textarea>

                <button
                    class="send-button"
                    id="sendButton"
                    title="Wyślij"
                >
                    ↑
                </button>

            </div>

            <div class="input-info">

                <span>
                    KVGDV AI
                </span>

                <span id="databaseInfo">
                    Baza: ładowanie...
                </span>

            </div>

        </div>

    </div>

</div>


<script>

/* =========================================
   KVGDV AI 0.5
   LOCAL BRAIN
========================================= */

const state = {

    data: null,

    messages: [],

    isTyping: false

};


/* =========================================
   ELEMENTS
========================================= */

const chat =
    document.getElementById("chat");

const chatInner =
    document.getElementById("chatInner");

const welcome =
    document.getElementById("welcome");

const input =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const statusText =
    document.getElementById("statusText");

const databaseInfo =
    document.getElementById("databaseInfo");

const newChatButton =
    document.getElementById("newChatButton");


/* =========================================
   NORMALIZE TEXT
========================================= */

function normalizeText(text) {

    return text
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[.,!?;:()[\]{}"'`]/g, "")
        .replace(/\s+/g, " ")
        .trim();

}


/* =========================================
   RANDOM ANSWER
========================================= */

function randomAnswer(responses) {

    if (
        !responses ||
        responses.length === 0
    ) {

        return "Nie mam jeszcze odpowiedzi na to pytanie.";

    }

    return responses[
        Math.floor(
            Math.random() * responses.length
        )
    ];

}


/* =========================================
   TOKENIZE
========================================= */

function tokenize(text) {

    return normalizeText(text)
        .split(" ")
        .filter(Boolean);

}


/* =========================================
   FIND INTENT
========================================= */

function findIntent(message) {

    if (
        !state.data ||
        !Array.isArray(state.data.intents)
    ) {

        return null;

    }


    const normalized =
        normalizeText(message);

    const words =
        tokenize(message);


    let bestIntent = null;
    let bestScore = 0;


    for (
        const intent of state.data.intents
    ) {

        if (
            !Array.isArray(intent.keywords)
        ) {
            continue;
        }


        let score = 0;


        for (
            const keyword of intent.keywords
        ) {

            const normalizedKeyword =
                normalizeText(keyword);

            if (!normalizedKeyword) {
                continue;
            }


            /*
                Dokładne dopasowanie
            */

            if (
                normalized ===
                normalizedKeyword
            ) {

                score += 100;

                continue;

            }


            /*
                Cała fraza znajduje się
                w wiadomości
            */

            if (
                normalized.includes(
                    normalizedKeyword
                )
            ) {

                score += 25;

            }


            /*
                Dopasowanie poszczególnych słów
            */

            const keywordWords =
                tokenize(keyword);


            for (
                const keywordWord
                of keywordWords
            ) {

                if (
                    words.includes(keywordWord)
                ) {

                    score += 5;

                }

            }

        }


        /*
            Lekka premia za krótkie
            i konkretne zapytania.
        */

        if (
            score > 0 &&
            words.length <= 4
        ) {

            score += 2;

        }


        if (
            score > bestScore
        ) {

            bestScore = score;
            bestIntent = intent;

        }

    }


    return {
        intent: bestIntent,
        score: bestScore
    };

}


/* =========================================
   AI RESPONSE
========================================= */

function getAIResponse(message) {

    if (!state.data) {

        return {
            text:
                "Moja baza wiedzy nie została jeszcze załadowana.",
            intent: null,
            score: 0
        };

    }


    const result =
        findIntent(message);


    /*
        Brak odpowiedniego dopasowania.
    */

    if (
        !result ||
        !result.intent ||
        result.score === 0
    ) {

        const unknown =
            state.data.intents.find(
                intent =>
                    intent.id === "unknown"
            );


        return {

            text: unknown
                ? randomAnswer(
                    unknown.responses
                )
                : "Nie znam jeszcze odpowiedzi na to pytanie.",

            intent: "unknown",

            score: 0

        };

    }


    return {

        text:
            randomAnswer(
                result.intent.responses
            ),

        intent:
            result.intent.id,

        score:
            result.score

    };

}


/* =========================================
   LINK DETECTION
========================================= */

function linkify(text) {

    const escaped =
        text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");


    const urlRegex =
        /(https?:\/\/[^\s<]+)/g;


    return escaped.replace(
        urlRegex,
        url => {

            return `
                <a
                    href="${url}"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    ${url}
                </a>
            `;

        }
    );

}


/* =========================================
   ADD MESSAGE
========================================= */

function addMessage(
    text,
    sender
) {

    if (welcome) {

        welcome.style.display =
            "none";

    }


    const message =
        document.createElement("div");


    message.className =
        `message ${sender}`;


    const avatar =
        document.createElement("div");

    avatar.className =
        "message-avatar";


    avatar.textContent =
        sender === "user"
            ? "Ty"
            : "K";


    const content =
        document.createElement("div");

    content.className =
        "message-content";


    if (sender === "assistant") {

        content.innerHTML =
            linkify(text);

    } else {

        content.textContent =
            text;

    }


    message.appendChild(avatar);
    message.appendChild(content);

    chatInner.appendChild(message);


    state.messages.push({
        sender,
        text
    });


    saveConversation();


    scrollToBottom();

}


/* =========================================
   TYPING INDICATOR
========================================= */

function showTyping() {

    const message =
        document.createElement("div");

    message.className =
        "message assistant";

    message.id =
        "typingMessage";


    const avatar =
        document.createElement("div");

    avatar.className =
        "message-avatar";

    avatar.textContent =
        "K";


    const content =
        document.createElement("div");

    content.className =
        "message-content";


    content.innerHTML = `
        <div class="typing">
            <span></span>
            <span></span>
            <span></span>
        </div>
    `;


    message.appendChild(avatar);
    message.appendChild(content);

    chatInner.appendChild(message);


    scrollToBottom();

}


/* =========================================
   HIDE TYPING
========================================= */

function hideTyping() {

    const typing =
        document.getElementById(
            "typingMessage"
        );


    if (typing) {

        typing.remove();

    }

}


/* =========================================
   SEND MESSAGE
========================================= */

async function sendMessage() {

    if (state.isTyping) {
        return;
    }


    const message =
        input.value.trim();


    if (!message) {
        return;
    }


    input.value = "";

    autoResize();


    addMessage(
        message,
        "user"
    );


    state.isTyping = true;

    sendButton.disabled = true;


    showTyping();


    /*
        Małe opóźnienie sprawia,
        że odpowiedź wygląda bardziej
        naturalnie.
    */

    const delay =
        Math.min(
            900,
            Math.max(
                250,
                message.length * 8
            )
        );


    await sleep(delay);


    hideTyping();


    const result =
        getAIResponse(message);


    addMessage(
        result.text,
        "assistant"
    );


    state.isTyping = false;

    sendButton.disabled = false;


    input.focus();

}


/* =========================================
   SLEEP
========================================= */

function sleep(ms) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}


/* =========================================
   ENTER
========================================= */

input.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =========================================
   SEND BUTTON
========================================= */

sendButton.addEventListener(
    "click",
    sendMessage
);


/* =========================================
   AUTO RESIZE
========================================= */

function autoResize() {

    input.style.height =
        "auto";


    input.style.height =
        Math.min(
            input.scrollHeight,
            150
        ) + "px";

}


input.addEventListener(
    "input",
    autoResize
);


/* =========================================
   SCROLL
========================================= */

function scrollToBottom() {

    requestAnimationFrame(() => {

        chat.scrollTo({
            top: chat.scrollHeight,
            behavior: "smooth"
        });

    });

}


/* =========================================
   SAVE CONVERSATION
========================================= */

function saveConversation() {

    try {

        localStorage.setItem(
            "kvgdv_ai_conversation",
            JSON.stringify(
                state.messages
            )
        );

    } catch (error) {

        console.warn(
            "Nie można zapisać rozmowy.",
            error
        );

    }

}


/* =========================================
   LOAD CONVERSATION
========================================= */

function loadConversation() {

    try {

        const saved =
            localStorage.getItem(
                "kvgdv_ai_conversation"
            );


        if (!saved) {
            return;
        }


        const messages =
            JSON.parse(saved);


        if (
            !Array.isArray(messages)
        ) {

            return;

        }


        for (
            const message
            of messages
        ) {

            if (
                message &&
                message.text &&
                (
                    message.sender === "user" ||
                    message.sender === "assistant"
                )
            ) {

                addMessage(
                    message.text,
                    message.sender
                );

            }

        }

    } catch (error) {

        console.warn(
            "Nie można odczytać historii.",
            error
        );

    }

}


/* =========================================
   NEW CHAT
========================================= */

newChatButton.addEventListener(
    "click",
    () => {

        localStorage.removeItem(
            "kvgdv_ai_conversation"
        );


        state.messages = [];


        chatInner.innerHTML = "";


        const newWelcome =
            document.createElement(
                "section"
            );


        newWelcome.className =
            "welcome";


        newWelcome.innerHTML = `
            <div class="welcome-logo">
                K
            </div>

            <h1>
                KVGDV AI
            </h1>

            <p>
                Twój lokalny eksperymentalny
                asystent AI. Napisz wiadomość,
                zadaj pytanie albo wklej link.
            </p>

            <div class="welcome-hint">
                Enter — wyślij · Shift + Enter — nowa linia
            </div>
        `;


        chatInner.appendChild(
            newWelcome
        );


        input.focus();

    }
);


/* =========================================
   LOAD JSON
========================================= */

async function loadKnowledge() {

    try {

        statusText.textContent =
            "Ładowanie bazy...";


        const response =
            await fetch(
                "./data/knowledge.json",
                {
                    cache: "no-cache"
                }
            );


        if (!response.ok) {

            throw new Error(
                `HTTP ${response.status}`
            );

        }


        const data =
            await response.json();


        /*
            Sprawdzamy nowy format.
        */

        if (
            !data ||
            !Array.isArray(data.intents)
        ) {

            throw new Error(
                "Nieprawidłowy format knowledge.json"
            );

        }


        state.data =
            data;


        const intentCount =
            data.intents.length;


        let responseCount = 0;


        for (
            const intent
            of data.intents
        ) {

            if (
                Array.isArray(
                    intent.responses
                )
            ) {

                responseCount +=
                    intent.responses.length;

            }

        }


        statusText.textContent =
            "KVGDV AI · Online";


        databaseInfo.textContent =
            `Baza: ${intentCount} tematów · ${responseCount} odpowiedzi`;


        console.log(
            "KVGDV AI:",
            "Baza załadowana.",
            data
        );


    } catch (error) {

        console.error(
            "KVGDV AI:",
            error
        );


        statusText.textContent =
            "Błąd bazy";


        databaseInfo.textContent =
            "Baza: błąd ładowania";


        state.data = null;

    }

}


/* =========================================
   START
========================================= */

async function start() {

    await loadKnowledge();

    loadConversation();

    input.focus();

}


start();

</script>

</body>
</html>
