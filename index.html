<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
        initial-scale=1,
        maximum-scale=1,
        viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#09090b"
    >

    <title>ADGVMaker — Tech Karol</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

<div id="app">

    <!-- HEADER -->

    <header class="topbar">

        <div class="brand">

            <div class="brand-icon">
                🎬
            </div>

            <div>
                <strong>
                    ADGVMaker
                </strong>

                <span>
                    by Tech Karol
                </span>
            </div>

        </div>


        <div class="top-actions">

            <button
                id="undoBtn"
                class="icon-btn"
                aria-label="Cofnij"
            >
                ↶
            </button>

            <button
                id="redoBtn"
                class="icon-btn"
                aria-label="Ponów"
            >
                ↷
            </button>

            <button
                id="saveProjectBtn"
                class="icon-btn"
                aria-label="Zapisz"
            >
                💾
            </button>

        </div>

    </header>


    <!-- PROJECT -->

    <main class="workspace">


        <!-- PREVIEW -->

        <section class="preview-section">

            <div class="preview-header">

                <span>
                    Podgląd
                </span>

                <span
                    id="currentTime"
                >
                    00:00
                </span>

                <span>/</span>

                <span
                    id="duration"
                >
                    00:10
                </span>

            </div>


            <div class="preview-wrapper">

                <div
                    id="canvas"
                    class="canvas"
                >

                    <div
                        id="canvasPlaceholder"
                        class="canvas-placeholder"
                    >

                        <div>
                            🎬
                        </div>

                        <span>
                            Dodaj element
                        </span>

                    </div>

                </div>

            </div>


            <!-- PLAYBACK -->

            <div class="playback">

                <button
                    id="stopBtn"
                    class="play-btn secondary"
                >
                    ■
                </button>

                <button
                    id="playBtn"
                    class="play-btn main"
                >
                    ▶
                </button>

                <button
                    id="pauseBtn"
                    class="play-btn secondary"
                >
                    ❚❚
                </button>

            </div>

        </section>


        <!-- TOOLS -->

        <section class="tools-section">

            <div class="section-title">
                Dodaj
            </div>


            <div class="tool-grid">

                <button
                    id="addImageBtn"
                    class="tool"
                >
                    <span>🖼️</span>
                    <small>Zdjęcie</small>
                </button>


                <button
                    id="addVideoBtn"
                    class="tool"
                >
                    <span>🎥</span>
                    <small>Video</small>
                </button>


                <button
                    id="addTextBtn"
                    class="tool"
                >
                    <span>✏️</span>
                    <small>Tekst</small>
                </button>


                <button
                    id="addLogoBtn"
                    class="tool"
                >
                    <span>🏷️</span>
                    <small>Logo</small>
                </button>


                <button
                    id="addIconBtn"
                    class="tool"
                >
                    <span>⭐</span>
                    <small>Ikona</small>
                </button>


                <button
                    id="aiBtn"
                    class="tool ai-tool"
                >
                    <span>✨</span>
                    <small>AI</small>
                </button>

            </div>


            <!-- HIDDEN FILE INPUTS -->

            <input
                id="imageInput"
                type="file"
                accept="image/*"
                hidden
            >

            <input
                id="videoInput"
                type="file"
                accept="video/*"
                hidden
            >

            <input
                id="logoInput"
                type="file"
                accept="image/png,image/svg+xml,image/webp"
                hidden
            >

        </section>


        <!-- TEMPLATES -->

        <section class="templates-section">

            <div class="section-header">

                <div class="section-title">
                    🧩 Szablony
                </div>

                <span class="template-count">
                    10 sekund
                </span>

            </div>


            <div class="templates">

                <button
                    class="template-card"
                    data-template="sale"
                >

                    <div class="template-preview sale">
                        🔥
                    </div>

                    <strong>
                        Promocja
                    </strong>

                    <small>
                        -30%
                    </small>

                </button>


                <button
                    class="template-card"
                    data-template="product"
                >

                    <div class="template-preview product">
                        📱
                    </div>

                    <strong>
                        Produkt
                    </strong>

                    <small>
                        Premium
                    </small>

                </button>


                <button
                    class="template-card"
                    data-template="gaming"
                >

                    <div class="template-preview gaming">
                        🎮
                    </div>

                    <strong>
                        Gaming
                    </strong>

                    <small>
                        Dynamic
                    </small>

                </button>


                <button
                    class="template-card"
                    data-template="business"
                >

                    <div class="template-preview business">
                        💼
                    </div>

                    <strong>
                        Firma
                    </strong>

                    <small>
                        Business
                    </small>

                </button>

            </div>

        </section>


        <!-- TIMELINE -->

        <section class="timeline-section">

            <div class="section-header">

                <div class="section-title">
                    Timeline
                </div>

                <select id="formatSelect">

                    <option value="1080x1920">
                        📱 9:16
                    </option>

                    <option value="1080x1080">
                        ⬜ 1:1
                    </option>

                    <option value="1920x1080">
                        🖥️ 16:9
                    </option>

                    <option value="1280x720">
                        ▶️ 720p
                    </option>

                </select>

            </div>


            <div class="timeline">

                <div class="track">

                    <span>
                        🎥
                    </span>

                    <div
                        id="mediaTrack"
                        class="track-content"
                    ></div>

                </div>


                <div class="track">

                    <span>
                        T
                    </span>

                    <div
                        id="textTrack"
                        class="track-content"
                    ></div>

                </div>


                <div class="track">

                    <span>
                        ✨
                    </span>

                    <div
                        id="graphicsTrack"
                        class="track-content"
                    ></div>

                </div>

            </div>

        </section>


        <!-- PROPERTIES -->

        <section
            id="propertiesPanel"
            class="properties"
        >

            <div class="no-selection">

                <div>
                    ⚙️
                </div>

                <p>
                    Wybierz element,
                    aby go edytować.
                </p>

            </div>

        </section>

    </main>


    <!-- BOTTOM BAR -->

    <nav class="bottom-bar">

        <button
            id="newProjectBtn"
        >
            <span>＋</span>
            Nowy
        </button>


        <button
            id="exportBtn"
            class="export-button"
        >
            <span>📤</span>
            Eksport
        </button>

    </nav>

</div>


<script
    type="module"
    src="app.js"
></script>

</body>
</html>
