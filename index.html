<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0f14">

  <title>KVGDV Maps</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0b0f14;
      --panel: rgba(17, 22, 29, 0.94);
      --panel-2: #151b23;
      --border: rgba(255,255,255,0.09);
      --text: #f1f5f9;
      --muted: #8b98a8;
      --accent: #4f8cff;
      --danger: #ff5c5c;
      --shadow: 0 12px 40px rgba(0,0,0,0.35);
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    button, input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    #map {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #10161d;
    }

    #mapCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: grab;
    }

    #mapCanvas.dragging {
      cursor: grabbing;
    }

    /* TOP BAR */

    .topbar {
      position: fixed;
      z-index: 20;
      top: 16px;
      left: 16px;
      right: 16px;

      display: flex;
      align-items: center;
      gap: 12px;

      pointer-events: none;
    }

    .topbar > * {
      pointer-events: auto;
    }

    .brand {
      height: 52px;

      display: flex;
      align-items: center;
      gap: 11px;

      padding: 0 17px;

      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 15px;

      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .brand-icon {
      width: 30px;
      height: 30px;

      display: grid;
      place-items: center;

      border-radius: 9px;

      background: var(--accent);

      font-size: 15px;
      font-weight: 800;
    }

    .brand-name {
      font-weight: 750;
      letter-spacing: -0.3px;
      white-space: nowrap;
    }

    .search {
      height: 52px;
      width: min(500px, 48vw);

      display: flex;
      align-items: center;
      gap: 10px;

      padding: 0 15px;

      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 15px;

      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .search-icon {
      color: var(--muted);
      font-size: 19px;
    }

    .search input {
      width: 100%;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--text);
      font-size: 14px;
    }

    .search input::placeholder {
      color: #748090;
    }

    .search-shortcut {
      padding: 4px 7px;
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }

    /* LEFT PANEL */

    .left-panel {
      position: fixed;
      z-index: 15;
      top: 84px;
      left: 16px;
      width: 270px;

      padding: 10px;

      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 17px;

      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .panel-section {
      padding: 8px;
    }

    .panel-title {
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .8px;
      text-transform: uppercase;
    }

    .tool {
      width: 100%;
      min-height: 43px;

      display: flex;
      align-items: center;
      gap: 11px;

      padding: 0 11px;

      border-radius: 11px;

      background: transparent;
      color: var(--text);

      text-align: left;
      transition: .15s ease;
    }

    .tool:hover {
      background: rgba(255,255,255,.06);
    }

    .tool.active {
      background: rgba(79,140,255,.13);
      color: #9cbdff;
    }

    .tool-icon {
      width: 25px;
      text-align: center;
      font-size: 17px;
    }

    .tool-text {
      font-size: 13px;
      font-weight: 550;
    }

    /* CONTROLS */

    .map-controls {
      position: fixed;
      z-index: 15;

      right: 16px;
      bottom: 104px;

      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .control-group {
      overflow: hidden;

      display: flex;
      flex-direction: column;

      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 13px;

      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .map-btn {
      width: 46px;
      height: 46px;

      display: grid;
      place-items: center;

      background: transparent;
      color: var(--text);

      font-size: 18px;
    }

    .map-btn:hover {
      background: rgba(255,255,255,.07);
    }

    .divider {
      height: 1px;
      background: var(--border);
    }

    /* LOCATION */

    .location-btn {
      position: fixed;
      z-index: 15;

      right: 16px;
      bottom: 16px;

      width: 46px;
      height: 46px;

      border-radius: 13px;

      background: var(--panel);
      border: 1px solid var(--border);

      color: var(--text);

      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);

      font-size: 18px;
    }

    /* BOTTOM */

    .bottom-bar {
      position: fixed;
      z-index: 20;

      left: 16px;
      right: 16px;
      bottom: 16px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      pointer-events: none;
    }

    .bottom-bar > * {
      pointer-events: auto;
    }

    .status,
    .coordinates {
      height: 44px;

      display: flex;
      align-items: center;

      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;

      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);

      color: var(--muted);
      font-size: 12px;
    }

    .status {
      gap: 9px;
      padding: 0 13px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #47d18c;
      box-shadow: 0 0 10px rgba(71,209,140,.6);
    }

    .coordinates {
      padding: 0 13px;
      font-variant-numeric: tabular-nums;
    }

    /* PLACE CARD */

    .place-card {
      position: fixed;
      z-index: 18;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -100%);

      display: none;

      padding: 9px 13px;

      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 11px;

      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);

      pointer-events: none;
    }

    .place-card.visible {
      display: block;
    }

    .place-name {
      font-size: 13px;
      font-weight: 700;
    }

    .place-type {
      margin-top: 2px;
      color: var(--muted);
      font-size: 10px;
    }

    @media (max-width:760px) {

      .topbar {
        left:10px;
        right:10px;
        top:10px;
      }

      .brand {
        padding:0 13px;
      }

      .brand-name {
        display:none;
      }

      .search {
        width:100%;
      }

      .left-panel {
        display:none;
      }

      .bottom-bar {
        left:10px;
        right:10px;
        bottom:10px;
      }

      .map-controls {
        right:10px;
        bottom:68px;
      }

      .location-btn {
        right:10px;
        bottom:10px;
      }

      .coordinates {
        display:none;
      }
    }
  </style>
</head>

<body>

<main id="map">
  <canvas id="mapCanvas"></canvas>
</main>

<header class="topbar">

  <div class="brand">
    <div class="brand-icon">K</div>
    <div class="brand-name">KVGDV Maps</div>
  </div>

  <div class="search">
    <div class="search-icon">⌕</div>

    <input
      id="searchInput"
      type="search"
      placeholder="Szukaj miejsca, adresu lub współrzędnych..."
      autocomplete="off"
    >

    <div class="search-shortcut">
      Ctrl K
    </div>
  </div>

</header>

<aside class="left-panel">

  <div class="panel-section">

    <div class="panel-title">
      Mapa
    </div>

    <button class="tool active">
      <span class="tool-icon">🗺️</span>
      <span class="tool-text">Mapa standardowa</span>
    </button>

    <button class="tool">
      <span class="tool-icon">🛰️</span>
      <span class="tool-text">Satelita</span>
    </button>

    <button class="tool">
      <span class="tool-icon">⛰️</span>
      <span class="tool-text">Teren</span>
    </button>

  </div>

  <div class="panel-section">

    <div class="panel-title">
      Narzędzia
    </div>

    <button class="tool">
      <span class="tool-icon">📍</span>
      <span class="tool-text">Dodaj punkt</span>
    </button>

    <button class="tool">
      <span class="tool-icon">🧭</span>
      <span class="tool-text">Wyznacz trasę</span>
    </button>

    <button class="tool">
      <span class="tool-icon">📏</span>
      <span class="tool-text">Zmierz odległość</span>
    </button>

  </div>

</aside>

<div class="map-controls">

  <div class="control-group">

    <button class="map-btn" id="zoomIn">+</button>

    <div class="divider"></div>

    <button class="map-btn" id="zoomOut">−</button>

  </div>

  <div class="control-group">

    <button class="map-btn" id="layersButton">
      ◈
    </button>

  </div>

</div>

<button
  class="location-btn"
  id="locationButton"
>
  ◎
</button>

<div class="place-card" id="placeCard">

  <div
    class="place-name"
    id="placeName"
  >
    Redlino
  </div>

  <div
    class="place-type"
    id="placeType"
  >
    Wieś
  </div>

</div>

<footer class="bottom-bar">

  <div class="status">

    <span class="status-dot"></span>

    <span id="engineStatus">
      KVGDV Maps Engine
    </span>

  </div>

  <div
    class="coordinates"
    id="coordinates"
  >
    Ładowanie mapy...
  </div>

</footer>


<script>

const canvas =
  document.getElementById("mapCanvas");

const ctx =
  canvas.getContext("2d");

const coordinatesElement =
  document.getElementById("coordinates");

const engineStatus =
  document.getElementById("engineStatus");

const placeCard =
  document.getElementById("placeCard");

const placeName =
  document.getElementById("placeName");

const placeType =
  document.getElementById("placeType");

const searchInput =
  document.getElementById("searchInput");


/* =========================================
   STATE
========================================= */

const state = {

  width: 0,
  height: 0,

  zoom: 30000,

  centerLat: 54.025456959035,
  centerLon: 15.9012336035926,

  mouseX: 0,
  mouseY: 0,

  dragging: false,

  lastMouseX: 0,
  lastMouseY: 0,

  geojson: null,

  places: [],
  roads: []

};


/* =========================================
   RESIZE
========================================= */

function resizeCanvas() {

  const dpr =
    window.devicePixelRatio || 1;

  state.width =
    window.innerWidth;

  state.height =
    window.innerHeight;

  canvas.width =
    state.width * dpr;

  canvas.height =
    state.height * dpr;

  canvas.style.width =
    state.width + "px";

  canvas.style.height =
    state.height + "px";

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );

  render();
}

window.addEventListener(
  "resize",
  resizeCanvas
);


/* =========================================
   GEO → SCREEN
========================================= */

function geoToScreen(lat, lon) {

  return {

    x:
      state.width / 2 +
      (lon - state.centerLon) *
      state.zoom,

    y:
      state.height / 2 -
      (lat - state.centerLat) *
      state.zoom

  };

}


/* =========================================
   SCREEN → GEO
========================================= */

function screenToGeo(x, y) {

  return {

    lon:
      state.centerLon +
      (x - state.width / 2) /
      state.zoom,

    lat:
      state.centerLat -
      (y - state.height / 2) /
      state.zoom

  };

}


/* =========================================
   BACKGROUND
========================================= */

function drawBackground() {

  ctx.fillStyle = "#10161d";

  ctx.fillRect(
    0,
    0,
    state.width,
    state.height
  );

}


/* =========================================
   GEOJSON GEOMETRY
========================================= */

function drawGeometry(
  geometry,
  properties
) {

  if (!geometry) return;

  const type =
    geometry.type;

  const coordinates =
    geometry.coordinates;


  /* LINE */

  if (type === "LineString") {

    drawLineString(
      coordinates,
      properties
    );

  }


  /* MULTI LINE */

  else if (
    type === "MultiLineString"
  ) {

    coordinates.forEach(
      line => {

        drawLineString(
          line,
          properties
        );

      }
    );

  }


  /* POLYGON */

  else if (type === "Polygon") {

    drawPolygon(coordinates);

  }


  /* MULTI POLYGON */

  else if (
    type === "MultiPolygon"
  ) {

    coordinates.forEach(
      polygon => {

        drawPolygon(polygon);

      }
    );

  }


  /* POINT */

  else if (type === "Point") {

    drawPoint(
      coordinates,
      properties
    );

  }

}


/* =========================================
   LINE
========================================= */

function drawLineString(
  coordinates,
  properties
) {

  if (
    !coordinates ||
    coordinates.length < 2
  ) {
    return;
  }

  ctx.beginPath();

  coordinates.forEach(
    (coord, index) => {

      /*
        GeoJSON:

        [longitude, latitude]
      */

      const lon =
        coord[0];

      const lat =
        coord[1];

      const p =
        geoToScreen(
          lat,
          lon
        );

      if (index === 0) {

        ctx.moveTo(
          p.x,
          p.y
        );

      } else {

        ctx.lineTo(
          p.x,
          p.y
        );

      }

    }
  );

  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  const highway =
    properties &&
    properties.highway;


  if (
    highway === "motorway" ||
    highway === "trunk" ||
    highway === "primary"
  ) {

    ctx.strokeStyle =
      "#697584";

    ctx.lineWidth =
      Math.max(
        2,
        state.zoom / 5000
      );

  } else {

    ctx.strokeStyle =
      "#3b4652";

    ctx.lineWidth =
      Math.max(
        1,
        state.zoom / 9000
      );

  }

  ctx.stroke();

}


/* =========================================
   POLYGON
========================================= */

function drawPolygon(
  rings
) {

  if (!rings) return;

  ctx.beginPath();

  rings.forEach(
    ring => {

      ring.forEach(
        (coord, index) => {

          const p =
            geoToScreen(
              coord[1],
              coord[0]
            );

          if (index === 0) {

            ctx.moveTo(
              p.x,
              p.y
            );

          } else {

            ctx.lineTo(
              p.x,
              p.y
            );

          }

        }
      );

      ctx.closePath();

    }
  );

  ctx.fillStyle =
    "#142534";

  ctx.fill();

}


/* =========================================
   POINT
========================================= */

function drawPoint(
  coordinates,
  properties
) {

  const p =
    geoToScreen(
      coordinates[1],
      coordinates[0]
    );

  ctx.beginPath();

  ctx.arc(
    p.x,
    p.y,
    6,
    0,
    Math.PI * 2
  );

  ctx.fillStyle =
    "#4f8cff";

  ctx.fill();

}


/* =========================================
   GEOJSON
========================================= */

function renderGeoJSON() {

  if (!state.geojson) {
    return;
  }

  const features =
    state.geojson.features || [];


  for (
    const feature of features
  ) {

    if (!feature.geometry) {
      continue;
    }

    drawGeometry(
      feature.geometry,
      feature.properties || {}
    );

  }


  /*
    Miejscowości rysujemy na końcu,
    żeby były nad drogami.
  */

  drawPlaces();

}


/* =========================================
   PLACES
========================================= */

function drawPlaces() {

  for (
    const place of state.places
  ) {

    const p =
      geoToScreen(
        place.lat,
        place.lon
      );


    /*
      Nie rysuj bardzo odległych
      elementów.
    */

    if (
      p.x < -100 ||
      p.x > state.width + 100 ||
      p.y < -100 ||
      p.y > state.height + 100
    ) {
      continue;
    }


    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      7,
      0,
      Math.PI * 2
    );

    ctx.fillStyle =
      "#4f8cff";

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      2.5,
      0,
      Math.PI * 2
    );

    ctx.fillStyle =
      "#ffffff";

    ctx.fill();


    ctx.font =
      "600 14px Inter, system-ui, sans-serif";

    ctx.textAlign =
      "center";

    ctx.textBaseline =
      "top";

    ctx.fillStyle =
      "#f1f5f9";

    ctx.fillText(
      place.name,
      p.x,
      p.y + 12
    );

  }

}


/* =========================================
   RENDER
========================================= */

function render() {

  drawBackground();

  renderGeoJSON();

  updateCoordinates();

}


/* =========================================
   COORDINATES
========================================= */

function updateCoordinates() {

  const geo =
    screenToGeo(
      state.mouseX,
      state.mouseY
    );

  coordinatesElement.textContent =
    `${geo.lat.toFixed(6)}° N · ` +
    `${geo.lon.toFixed(6)}° E`;

}


/* =========================================
   MOUSE
========================================= */

canvas.addEventListener(
  "mousedown",
  event => {

    state.dragging = true;

    state.lastMouseX =
      event.clientX;

    state.lastMouseY =
      event.clientY;

    canvas.classList.add(
      "dragging"
    );

  }
);


window.addEventListener(
  "mouseup",
  () => {

    state.dragging = false;

    canvas.classList.remove(
      "dragging"
    );

  }
);


canvas.addEventListener(
  "mousemove",
  event => {

    state.mouseX =
      event.clientX;

    state.mouseY =
      event.clientY;


    if (
      state.dragging
    ) {

      const dx =
        event.clientX -
        state.lastMouseX;

      const dy =
        event.clientY -
        state.lastMouseY;


      state.centerLon -=
        dx / state.zoom;

      state.centerLat +=
        dy / state.zoom;


      state.lastMouseX =
        event.clientX;

      state.lastMouseY =
        event.clientY;


      render();

    } else {

      updateCoordinates();

    }

  }
);


/* =========================================
   ZOOM
========================================= */

canvas.addEventListener(
  "wheel",
  event => {

    event.preventDefault();

    const before =
      screenToGeo(
        event.clientX,
        event.clientY
      );


    const factor =
      event.deltaY < 0
        ? 1.25
        : 1 / 1.25;


    state.zoom *= factor;

    state.zoom =
      Math.max(
        1000,
        Math.min(
          1000000,
          state.zoom
        )
      );


    const after =
      screenToGeo(
        event.clientX,
        event.clientY
      );


    state.centerLon +=
      before.lon -
      after.lon;

    state.centerLat +=
      before.lat -
      after.lat;


    render();

  },
  {
    passive: false
  }
);


/* =========================================
   ZOOM BUTTONS
========================================= */

document
  .getElementById("zoomIn")
  .addEventListener(
    "click",
    () => {

      state.zoom *= 1.25;

      state.zoom =
        Math.min(
          state.zoom,
          1000000
        );

      render();

    }
  );


document
  .getElementById("zoomOut")
  .addEventListener(
    "click",
    () => {

      state.zoom /= 1.25;

      state.zoom =
        Math.max(
          state.zoom,
          1000
        );

      render();

    }
  );


/* =========================================
   LOCATION
========================================= */

document
  .getElementById("locationButton")
  .addEventListener(
    "click",
    () => {

      if (!navigator.geolocation) {

        alert(
          "Geolokalizacja nie jest obsługiwana."
        );

        return;

      }


      navigator.geolocation.getCurrentPosition(
        position => {

          state.centerLat =
            position.coords.latitude;

          state.centerLon =
            position.coords.longitude;

          render();

        },

        () => {

          alert(
            "Nie udało się pobrać lokalizacji."
          );

        }

      );

    }
  );


/* =========================================
   SEARCH
========================================= */

searchInput.addEventListener(
  "keydown",
  event => {

    if (
      event.key !== "Enter"
    ) {
      return;
    }


    const query =
      searchInput.value
        .trim()
        .toLowerCase();


    const result =
      state.places.find(
        place =>
          place.name
            .toLowerCase()
            .includes(query)
      );


    if (!result) {

      alert(
        "KVGDV Maps: nie znaleziono miejsca."
      );

      return;

    }


    state.centerLat =
      result.lat;

    state.centerLon =
      result.lon;


    placeName.textContent =
      result.name;

    placeType.textContent =
      result.type || "Miejscowość";


    placeCard.classList.add(
      "visible"
    );


    render();

  }
);


/* =========================================
   CTRL + K
========================================= */

document.addEventListener(
  "keydown",
  event => {

    if (
      (event.ctrlKey ||
       event.metaKey) &&
      event.key.toLowerCase() === "k"
    ) {

      event.preventDefault();

      searchInput.focus();

    }

  }
);


/* =========================================
   EXTRACT PLACES
========================================= */

function extractPlaces() {

  state.places = [];


  const features =
    state.geojson.features || [];


  for (
    const feature of features
  ) {

    const geometry =
      feature.geometry;

    const props =
      feature.properties || {};


    if (
      !geometry ||
      geometry.type !== "Point"
    ) {
      continue;
    }


    const name =
      props.name ||
      props.nazwa ||
      props["name:pl"];


    if (!name) {
      continue;
    }


    const type =
      props.place ||
      props.typ ||
      "Miejscowość";


    state.places.push({

      name: String(name),

      type: String(type),

      lon:
        geometry.coordinates[0],

      lat:
        geometry.coordinates[1]

    });

  }

}


/* =========================================
   LOAD GEOJSON
========================================= */

async function loadMapData() {

  try {

    engineStatus.textContent =
      "Ładowanie KVGDV Map Data...";


    /*
      WAŻNE:

      index.html jest w głównym katalogu repo,
      a GeoJSON znajduje się w:

      data/zachodniopomorskie.geojson
    */

    const response =
      await fetch(
        "./data/zachodniopomorskie.geojson"
      );


    if (!response.ok) {

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    if (
      data.type !== "FeatureCollection"
    ) {

      throw new Error(
        "Plik nie jest prawidłowym GeoJSON FeatureCollection."
      );

    }


    state.geojson =
      data;


    extractPlaces();


    /*
      Ustawienie centrum na pierwszą
      znalezioną miejscowość.
    */

    if (
      state.places.length > 0
    ) {

      state.centerLat =
        state.places[0].lat;

      state.centerLon =
        state.places[0].lon;

    }


    engineStatus.textContent =
      "KVGDV Maps Engine · " +
      state.places.length +
      " miejsc · " +
      data.features.length +
      " obiektów";


    render();


    console.log(
      "KVGDV GeoJSON załadowany:",
      data
    );

    console.log(
      "Miejscowości:",
      state.places.length
    );


  } catch (error) {

    console.error(
      "KVGDV Maps:",
      error
    );


    engineStatus.textContent =
      "KVGDV Maps Engine · BŁĄD GEOJSON";


    /*
      Nie robimy białego ekranu.
    */

    render();

    alert(
      "Nie udało się załadować GeoJSON.\n\n" +
      error.message
    );

  }

}


/* =========================================
   START
========================================= */

resizeCanvas();

loadMapData();

</script>
