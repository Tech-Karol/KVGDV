<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0f14">

  <title>KVGDV Maps — Wersja pierwsza</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0b0f14;
      --panel: rgba(17, 22, 29, 0.94);
      --panel-2: #151b23;
      --border: rgba(255, 255, 255, 0.09);
      --text: #f1f5f9;
      --muted: #8b98a8;
      --accent: #4f8cff;
      --accent-hover: #6b9eff;
      --danger: #ff5c5c;
      --shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: var(--bg);
      color: var(--text);
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    /* =========================================
       MAP
    ========================================= */

    #map {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(
          circle at 50% 45%,
          rgba(45, 57, 72, 0.35),
          transparent 42%
        ),
        #10161d;
    }

    #mapCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: grab;
    }

    #mapCanvas.dragging {
      cursor: grabbing;
    }

    /* =========================================
       TOP BAR
    ========================================= */

    .topbar {
      position: fixed;
      z-index: 20;

      top: 16px;
      left: 16px;
      right: 16px;

      display: flex;
      align-items: center;
      gap: 12px;

      pointer-events: none;
    }

    .topbar > * {
      pointer-events: auto;
    }

    .brand {
      height: 52px;

      display: flex;
      align-items: center;
      gap: 11px;

      padding: 0 17px;

      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 15px;

      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .brand-icon {
      width: 30px;
      height: 30px;

      display: grid;
      place-items: center;

      border-radius: 9px;

      background: var(--accent);

      font-size: 15px;
      font-weight: 800;
    }

    .brand-name {
      font-weight: 750;
      letter-spacing: -0.3px;
      white-space: nowrap;
    }

    .search {
      height: 52px;
      width: min(500px, 48vw);

      display: flex;
      align-items: center;
      gap: 10px;

      padding: 0 15px;

      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 15px;

      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .search-icon {
      color: var(--muted);
      font-size: 19px;
    }

    .search input {
      width: 100%;

      border: 0;
      outline: none;

      background: transparent;

      color: var(--text);
      font-size: 14px;
    }

    .search input::placeholder {
      color: #748090;
    }

    .search-shortcut {
      padding: 4px 7px;

      border: 1px solid var(--border);
      border-radius: 7px;

      color: var(--muted);

      font-size: 11px;
      white-space: nowrap;
    }

    /* =========================================
       LEFT PANEL
    ========================================= */

    .left-panel {
      position: fixed;
      z-index: 15;

      top: 84px;
      left: 16px;

      width: 270px;

      padding: 10px;

      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 17px;

      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .panel-section {
      padding: 8px;
    }

    .panel-title {
      margin-bottom: 8px;

      color: var(--muted);

      font-size: 11px;
      font-weight: 700;

      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .tool {
      width: 100%;
      min-height: 43px;

      display: flex;
      align-items: center;
      gap: 11px;

      padding: 0 11px;

      border-radius: 11px;

      background: transparent;
      color: var(--text);

      text-align: left;

      transition: 0.15s ease;
    }

    .tool:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .tool.active {
      background: rgba(79, 140, 255, 0.13);
      color: #9cbdff;
    }

    .tool-icon {
      width: 25px;
      text-align: center;
      font-size: 17px;
    }

    .tool-text {
      font-size: 13px;
      font-weight: 550;
    }

    /* =========================================
       RIGHT CONTROLS
    ========================================= */

    .map-controls {
      position: fixed;
      z-index: 15;

      right: 16px;
      bottom: 104px;

      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .control-group {
      overflow: hidden;

      display: flex;
      flex-direction: column;

      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 13px;

      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .map-btn {
      width: 46px;
      height: 46px;

      display: grid;
      place-items: center;

      background: transparent;
      color: var(--text);

      font-size: 18px;

      transition: 0.15s ease;
    }

    .map-btn:hover {
      background: rgba(255, 255, 255, 0.07);
    }

    .divider {
      height: 1px;
      background: var(--border);
    }

    /* =========================================
       LOCATION
    ========================================= */

    .location-btn {
      position: fixed;
      z-index: 15;

      right: 16px;
      bottom: 16px;

      width: 46px;
      height: 46px;

      border-radius: 13px;

      background: var(--panel);
      border: 1px solid var(--border);

      color: var(--text);

      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);

      font-size: 18px;
    }

    .location-btn:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    /* =========================================
       BOTTOM BAR
    ========================================= */

    .bottom-bar {
      position: fixed;
      z-index: 20;

      left: 16px;
      right: 16px;
      bottom: 16px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      pointer-events: none;
    }

    .bottom-bar > * {
      pointer-events: auto;
    }

    .status {
      height: 44px;

      display: flex;
      align-items: center;
      gap: 9px;

      padding: 0 13px;

      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;

      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);

      color: var(--muted);
      font-size: 12px;
    }

    .status-dot {
      width: 8px;
      height: 8px;

      border-radius: 50%;

      background: #47d18c;

      box-shadow:
        0 0 10px rgba(71, 209, 140, 0.6);
    }

    .coordinates {
      height: 44px;

      display: flex;
      align-items: center;

      padding: 0 13px;

      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;

      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);

      color: var(--muted);

      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    /* =========================================
       PLACE INFO
    ========================================= */

    .place-card {
      position: fixed;
      z-index: 18;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -100%);

      display: none;

      padding: 9px 13px;

      background: var(--panel);

      border: 1px solid var(--border);
      border-radius: 11px;

      box-shadow: var(--shadow);

      backdrop-filter: blur(18px);

      pointer-events: none;
    }

    .place-card.visible {
      display: block;
    }

    .place-name {
      font-size: 13px;
      font-weight: 700;
    }

    .place-type {
      margin-top: 2px;

      color: var(--muted);

      font-size: 10px;
    }

    /* =========================================
       LOADING
    ========================================= */

    .loading {
      position: fixed;
      z-index: 10;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      padding: 14px 18px;

      border-radius: 12px;

      background: rgba(17, 22, 29, 0.88);
      border: 1px solid var(--border);

      color: var(--muted);

      font-size: 13px;

      pointer-events: none;

      transition: opacity 0.2s ease;
    }

    .loading.hidden {
      opacity: 0;
    }

    /* =========================================
       RESPONSIVE
    ========================================= */

    @media (max-width: 760px) {

      .topbar {
        left: 10px;
        right: 10px;
        top: 10px;
      }

      .brand {
        padding: 0 13px;
      }

      .brand-name {
        display: none;
      }

      .search {
        width: 100%;
      }

      .left-panel {
        display: none;
      }

      .bottom-bar {
        left: 10px;
        right: 10px;
        bottom: 10px;
      }

      .map-controls {
        right: 10px;
        bottom: 68px;
      }

      .location-btn {
        right: 10px;
        bottom: 10px;
      }

      .coordinates {
        display: none;
      }
    }
  </style>
</head>

<body>

  <!-- =========================================
       MAP
  ========================================== -->

  <main id="map">

    <canvas id="mapCanvas"></canvas>

  </main>


  <!-- =========================================
       LOADING
  ========================================== -->

  <div
    class="loading"
    id="loading"
  >
    Ładowanie mapy...
  </div>


  <!-- =========================================
       TOP BAR
  ========================================== -->

  <header class="topbar">

    <div class="brand">

      <div class="brand-icon">
        K
      </div>

      <div class="brand-name">
        KVGDV Maps
      </div>

    </div>


    <div class="search">

      <div class="search-icon">
        ⌕
      </div>

      <input
        id="searchInput"
        type="search"
        placeholder="Szukaj miejsca, adresu lub współrzędnych..."
        autocomplete="off"
      >

      <div class="search-shortcut">
        Ctrl K
      </div>

    </div>

  </header>


  <!-- =========================================
       LEFT PANEL
  ========================================== -->

  <aside class="left-panel">

    <div class="panel-section">

      <div class="panel-title">
        Mapa
      </div>

      <button class="tool active">
        <span class="tool-icon">🗺️</span>
        <span class="tool-text">
          Mapa standardowa
        </span>
      </button>

      <button class="tool">
        <span class="tool-icon">🛰️</span>
        <span class="tool-text">
          Satelita
        </span>
      </button>

      <button class="tool">
        <span class="tool-icon">⛰️</span>
        <span class="tool-text">
          Teren
        </span>
      </button>

    </div>


    <div class="panel-section">

      <div class="panel-title">
        Narzędzia
      </div>

      <button class="tool">
        <span class="tool-icon">📍</span>
        <span class="tool-text">
          Dodaj punkt
        </span>
      </button>

      <button class="tool">
        <span class="tool-icon">🧭</span>
        <span class="tool-text">
          Wyznacz trasę
        </span>
      </button>

      <button class="tool">
        <span class="tool-icon">📏</span>
        <span class="tool-text">
          Zmierz odległość
        </span>
      </button>

    </div>

  </aside>


  <!-- =========================================
       RIGHT CONTROLS
  ========================================== -->

  <div class="map-controls">

    <div class="control-group">

      <button
        class="map-btn"
        id="zoomIn"
        title="Przybliż"
      >
        +
      </button>

      <div class="divider"></div>

      <button
        class="map-btn"
        id="zoomOut"
        title="Oddal"
      >
        −
      </button>

    </div>


    <div class="control-group">

      <button
        class="map-btn"
        id="layersButton"
        title="Warstwy"
      >
        ◈
      </button>

    </div>

  </div>


  <!-- =========================================
       LOCATION
  ========================================== -->

  <button
    class="location-btn"
    id="locationButton"
    title="Moja lokalizacja"
  >
    ◎
  </button>


  <!-- =========================================
       PLACE CARD
  ========================================== -->

  <div
    class="place-card"
    id="placeCard"
  >

    <div
      class="place-name"
      id="placeName"
    >
      Miejsce
    </div>

    <div
      class="place-type"
      id="placeType"
    >
      Punkt
    </div>

  </div>


  <!-- =========================================
       BOTTOM BAR
  ========================================== -->

  <footer class="bottom-bar">

    <div class="status">

      <span class="status-dot"></span>

      <span id="engineStatus">
        KVGDV Maps Engine
      </span>

    </div>


    <div
      class="coordinates"
      id="coordinates"
    >
      Ładowanie mapy...
    </div>

  </footer>


  <!-- =========================================
       KVGDV MAPS ENGINE
       WERSJA PIERWSZA
  ========================================== -->

  <script>

    /*
      ============================================
      KVGDV MAPS
      WERSJA PIERWSZA
      ============================================

      Dane:
        data/zachodniopomorskie.geojson

      Format:
        GeoJSON / FeatureCollection

      Obsługiwane geometrie:
        Point
        MultiPoint
        LineString
        MultiLineString
        Polygon
        MultiPolygon

      Bez:
        Leaflet
        Mapbox
        Google Maps
        zewnętrznych bibliotek
    */


    const canvas =
      document.getElementById("mapCanvas");

    const ctx =
      canvas.getContext("2d");

    const coordinatesElement =
      document.getElementById("coordinates");

    const engineStatus =
      document.getElementById("engineStatus");

    const placeCard =
      document.getElementById("placeCard");

    const placeName =
      document.getElementById("placeName");

    const placeType =
      document.getElementById("placeType");

    const searchInput =
      document.getElementById("searchInput");

    const loading =
      document.getElementById("loading");


    /* =========================================
       STATE
    ========================================== */

    const state = {

      width: 0,
      height: 0,

      zoom: 1,

      centerLon: 15.9,
      centerLat: 54.025,

      mouseX: 0,
      mouseY: 0,

      dragging: false,

      lastMouseX: 0,
      lastMouseY: 0,

      data: null,

      features: [],

      points: [],

      lines: [],

      polygons: [],

      bounds: null

    };


    /* =========================================
       RESIZE
    ========================================== */

    function resizeCanvas() {

      const dpr =
        window.devicePixelRatio || 1;

      state.width =
        window.innerWidth;

      state.height =
        window.innerHeight;

      canvas.width =
        state.width * dpr;

      canvas.height =
        state.height * dpr;

      canvas.style.width =
        state.width + "px";

      canvas.style.height =
        state.height + "px";

      ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
      );

      render();

    }


    window.addEventListener(
      "resize",
      resizeCanvas
    );


    /* =========================================
       GEO → SCREEN
    ========================================== */

    function geoToScreen(
      lon,
      lat
    ) {

      const x =
        state.width / 2 +
        (
          lon -
          state.centerLon
        ) *
        state.zoom;

      const y =
        state.height / 2 -
        (
          lat -
          state.centerLat
        ) *
        state.zoom;


      return {
        x,
        y
      };

    }


    /* =========================================
       SCREEN → GEO
    ========================================== */

    function screenToGeo(
      x,
      y
    ) {

      const lon =
        state.centerLon +
        (
          x -
          state.width / 2
        ) /
        state.zoom;

      const lat =
        state.centerLat -
        (
          y -
          state.height / 2
        ) /
        state.zoom;


      return {
        lat,
        lon
      };

    }


    /* =========================================
       BACKGROUND
    ========================================== */

    function drawBackground() {

      ctx.fillStyle =
        "#10161d";

      ctx.fillRect(
        0,
        0,
        state.width,
        state.height
      );


      /*
        Delikatna siatka.
      */

      const grid =
        Math.max(
          60,
          Math.min(
            120,
            state.zoom / 100
          )
        );


      ctx.strokeStyle =
        "rgba(255,255,255,0.025)";

      ctx.lineWidth =
        1;


      for (
        let x = 0;
        x < state.width;
        x += grid
      ) {

        ctx.beginPath();

        ctx.moveTo(
          x,
          0
        );

        ctx.lineTo(
          x,
          state.height
        );

        ctx.stroke();

      }


      for (
        let y = 0;
        y < state.height;
        y += grid
      ) {

        ctx.beginPath();

        ctx.moveTo(
          0,
          y
        );

        ctx.lineTo(
          state.width,
          y
        );

        ctx.stroke();

      }

    }


    /* =========================================
       PROPERTY NAME
    ========================================== */

    function getName(
      properties
    ) {

      if (!properties) {
        return "";
      }


      return (
        properties.name ||
        properties.nazwa ||
        properties.Name ||
        properties.NAME ||
        properties.ref ||
        ""
      );

    }


    /* =========================================
       PROPERTY TYPE
    ========================================== */

    function getType(
      properties
    ) {

      if (!properties) {
        return "";
      }


      return (
        properties.type ||
        properties.typ ||
        properties.place ||
        properties.highway ||
        ""
      );

    }


    /* =========================================
       DRAW LINE
    ========================================== */

    function drawLine(
      coordinates,
      style
    ) {

      if (
        !Array.isArray(coordinates) ||
        coordinates.length < 2
      ) {

        return;

      }


      ctx.beginPath();

      let started =
        false;


      for (
        const point of coordinates
      ) {

        if (
          !Array.isArray(point) ||
          point.length < 2
        ) {

          continue;

        }


        const lon =
          Number(point[0]);

        const lat =
          Number(point[1]);


        if (
          !Number.isFinite(lon) ||
          !Number.isFinite(lat)
        ) {

          continue;

        }


        const p =
          geoToScreen(
            lon,
            lat
          );


        if (!started) {

          ctx.moveTo(
            p.x,
            p.y
          );

          started =
            true;

        } else {

          ctx.lineTo(
            p.x,
            p.y
          );

        }

      }


      if (!started) {
        return;
      }


      ctx.lineCap =
        "round";

      ctx.lineJoin =
        "round";

      ctx.strokeStyle =
        style.color;

      ctx.lineWidth =
        style.width;

      ctx.stroke();

    }


    /* =========================================
       ROAD STYLE
    ========================================== */

    function getRoadStyle(
      properties
    ) {

      const highway =
        String(
          properties?.highway ||
          properties?.autostrada ||
          properties?.type ||
          properties?.typ ||
          ""
        ).toLowerCase();


      if (
        highway.includes("motorway") ||
        highway.includes("autostrada")
      ) {

        return {
          color: "#d79b67",
          width: 8
        };

      }


      if (
        highway.includes("trunk") ||
        highway.includes("ekspresowa")
      ) {

        return {
          color: "#c98957",
          width: 7
        };

      }


      if (
        highway.includes("primary") ||
        highway.includes("główna") ||
        highway.includes("glowna") ||
        highway.includes("główna")
      ) {

        return {
          color: "#aeb7c2",
          width: 6
        };

      }


      if (
        highway.includes("secondary") ||
        highway.includes("drugorzędna") ||
        highway.includes("drugorzedna")
      ) {

        return {
          color: "#89939f",
          width: 5
        };

      }


      if (
        highway.includes("tertiary")
      ) {

        return {
          color: "#737e8b",
          width: 4
        };

      }


      return {
        color: "#4b5663",
        width: 3
      };

    }


    /* =========================================
       DRAW LINESTRING
    ========================================== */

    function drawLineString(
      coordinates,
      properties
    ) {

      drawLine(
        coordinates,
        getRoadStyle(
          properties
        )
      );

    }


    /* =========================================
       DRAW MULTILINESTRING
    ========================================== */

    function drawMultiLineString(
      coordinates,
      properties
    ) {

      if (
        !Array.isArray(coordinates)
      ) {

        return;

      }


      for (
        const line of coordinates
      ) {

        drawLineString(
          line,
          properties
        );

      }

    }


    /* =========================================
       DRAW POLYGON
    ========================================== */

    function drawPolygon(
      coordinates,
      properties
    ) {

      if (
        !Array.isArray(coordinates)
      ) {

        return;

      }


      /*
        Pierścień zewnętrzny.
      */

      const outer =
        coordinates[0];


      if (
        !Array.isArray(outer) ||
        outer.length < 3
      ) {

        return;

      }


      ctx.beginPath();


      for (
        let i = 0;
        i < outer.length;
        i++
      ) {

        const point =
          outer[i];


        if (
          !Array.isArray(point) ||
          point.length < 2
        ) {

          continue;

        }


        const p =
          geoToScreen(
            Number(point[0]),
            Number(point[1])
          );


        if (i === 0) {

          ctx.moveTo(
            p.x,
            p.y
          );

        } else {

          ctx.lineTo(
            p.x,
            p.y
          );

        }

      }


      ctx.closePath();


      ctx.fillStyle =
        "rgba(42, 59, 71, 0.35)";

      ctx.fill();


      ctx.strokeStyle =
        "rgba(104, 126, 143, 0.45)";

      ctx.lineWidth =
        1;

      ctx.stroke();

    }


    /* =========================================
       DRAW MULTIPOLYGON
    ========================================== */

    function drawMultiPolygon(
      coordinates,
      properties
    ) {

      if (
        !Array.isArray(coordinates)
      ) {

        return;

      }


      for (
        const polygon of coordinates
      ) {

        drawPolygon(
          polygon,
          properties
        );

      }

    }


    /* =========================================
       DRAW POINT
    ========================================== */

    function drawPoint(
      coordinates,
      properties
    ) {

      if (
        !Array.isArray(coordinates) ||
        coordinates.length < 2
      ) {

        return;

      }


      const lon =
        Number(coordinates[0]);

      const lat =
        Number(coordinates[1]);


      if (
        !Number.isFinite(lon) ||
        !Number.isFinite(lat)
      ) {

        return;

      }


      const p =
        geoToScreen(
          lon,
          lat
        );


      /*
        Nie pokazujemy punktów bardzo daleko
        poza ekranem.
      */

      if (
        p.x < -100 ||
        p.x > state.width + 100 ||
        p.y < -100 ||
        p.y > state.height + 100
      ) {

        return;

      }


      ctx.beginPath();

      ctx.arc(
        p.x,
        p.y,
        6,
        0,
        Math.PI * 2
      );

      ctx.fillStyle =
        "#4f8cff";

      ctx.fill();


      ctx.beginPath();

      ctx.arc(
        p.x,
        p.y,
        2.5,
        0,
        Math.PI * 2
      );

      ctx.fillStyle =
        "#ffffff";

      ctx.fill();


      const name =
        getName(
          properties
        );


      /*
        Nazwy punktów pokazujemy,
        jeżeli istnieją.
      */

      if (name) {

        ctx.font =
          "600 13px system-ui";

        ctx.textAlign =
          "center";

        ctx.textBaseline =
          "top";

        ctx.fillStyle =
          "#f1f5f9";

        ctx.shadowColor =
          "rgba(0,0,0,0.95)";

        ctx.shadowBlur =
          5;

        ctx.fillText(
          name,
          p.x,
          p.y + 10
        );

        ctx.shadowBlur =
          0;

      }

    }


    /* =========================================
       DRAW MULTIPOINT
    ========================================== */

    function drawMultiPoint(
      coordinates,
      properties
    ) {

      if (
        !Array.isArray(coordinates)
      ) {

        return;

      }


      for (
        const point of coordinates
      ) {

        drawPoint(
          point,
          properties
        );

      }

    }


    /* =========================================
       DRAW FEATURE
    ========================================== */

    function drawFeature(
      feature
    ) {

      if (
        !feature ||
        !feature.geometry
      ) {

        return;

      }


      const geometry =
        feature.geometry;

      const properties =
        feature.properties || {};


      switch (
        geometry.type
      ) {

        case "Point":

          drawPoint(
            geometry.coordinates,
            properties
          );

          break;


        case "MultiPoint":

          drawMultiPoint(
            geometry.coordinates,
            properties
          );

          break;


        case "LineString":

          drawLineString(
            geometry.coordinates,
            properties
          );

          break;


        case "MultiLineString":

          drawMultiLineString(
            geometry.coordinates,
            properties
          );

          break;


        case "Polygon":

          drawPolygon(
            geometry.coordinates,
            properties
          );

          break;


        case "MultiPolygon":

          drawMultiPolygon(
            geometry.coordinates,
            properties
          );

          break;

      }

    }


    /* =========================================
       RENDER
    ========================================== */

    function render() {

      drawBackground();


      /*
        Poligony najpierw.
      */

      for (
        const feature of state.features
      ) {

        if (
          feature.geometry &&
          (
            feature.geometry.type ===
              "Polygon" ||

            feature.geometry.type ===
              "MultiPolygon"
          )
        ) {

          drawFeature(
            feature
          );

        }

      }


      /*
        Drogi następnie.
      */

      for (
        const feature of state.features
      ) {

        if (
          feature.geometry &&
          (
            feature.geometry.type ===
              "LineString" ||

            feature.geometry.type ===
              "MultiLineString"
          )
        ) {

          drawFeature(
            feature
          );

        }

      }


      /*
        Punkty na końcu.
      */

      for (
        const feature of state.features
      ) {

        if (
          feature.geometry &&
          (
            feature.geometry.type ===
              "Point" ||

            feature.geometry.type ===
              "MultiPoint"
          )
        ) {

          drawFeature(
            feature
          );

        }

      }


      updateCoordinates();

    }


    /* =========================================
       BOUNDS
    ========================================== */

    function calculateBounds() {

      let minLon =
        Infinity;

      let maxLon =
        -Infinity;

      let minLat =
        Infinity;

      let maxLat =
        -Infinity;


      function inspect(
        coordinates
      ) {

        if (
          !Array.isArray(coordinates)
        ) {

          return;

        }


        /*
          [lon, lat]
        */

        if (
          coordinates.length >= 2 &&
          typeof coordinates[0] ===
            "number" &&
          typeof coordinates[1] ===
            "number"
        ) {

          const lon =
            coordinates[0];

          const lat =
            coordinates[1];


          minLon =
            Math.min(
              minLon,
              lon
            );

          maxLon =
            Math.max(
              maxLon,
              lon
            );

          minLat =
            Math.min(
              minLat,
              lat
            );

          maxLat =
            Math.max(
              maxLat,
              lat
            );

          return;

        }


        for (
          const item of coordinates
        ) {

          inspect(
            item
          );

        }

      }


      for (
        const feature of state.features
      ) {

        if (
          feature.geometry
        ) {

          inspect(
            feature.geometry.coordinates
          );

        }

      }


      if (
        minLon !== Infinity &&
        maxLon !== -Infinity &&
        minLat !== Infinity &&
        maxLat !== -Infinity
      ) {

        state.bounds = {

          minLon,
          maxLon,
          minLat,
          maxLat

        };

      }

    }


    /* =========================================
       FIT MAP TO DATA
    ========================================== */

    function fitMapToData() {

      if (
        !state.bounds
      ) {

        return;

      }


      const b =
        state.bounds;


      state.centerLon =
        (b.minLon + b.maxLon) / 2;

      state.centerLat =
        (b.minLat + b.maxLat) / 2;


      const lonRange =
        Math.max(
          0.001,
          b.maxLon - b.minLon
        );

      const latRange =
        Math.max(
          0.001,
          b.maxLat - b.minLat
        );


      const padding =
        0.82;


      const zoomX =
        (
          state.width *
          padding
        ) /
        lonRange;


      const zoomY =
        (
          state.height *
          padding
        ) /
        latRange;


      state.zoom =
        Math.min(
          zoomX,
          zoomY
        );


      /*
        Ograniczenia zoomu.
      */

      state.zoom =
        Math.max(
          500,
          Math.min(
            state.zoom,
            1000000
          )
        );

    }


    /* =========================================
       NORMALIZE GEOJSON
    ========================================== */

    function normalizeGeoJSON(
      json
    ) {

      if (!json) {

        return [];

      }


      /*
        FeatureCollection
      */

      if (
        json.type ===
        "FeatureCollection"
      ) {

        return Array.isArray(
          json.features
        )
          ? json.features
          : [];

      }


      /*
        Pojedynczy Feature
      */

      if (
        json.type ===
        "Feature"
      ) {

        return [json];

      }


      /*
        Geometry
      */

      if (
        typeof json.type ===
          "string" &&
        json.coordinates
      ) {

        return [

          {
            type: "Feature",

            properties: {},

            geometry: json

          }

        ];

      }


      return [];

    }


    /* =========================================
       SEARCH
    ========================================== */

    searchInput.addEventListener(
      "keydown",
      event => {

        if (
          event.key !==
          "Enter"
        ) {

          return;

        }


        const query =
          searchInput.value
            .trim()
            .toLowerCase();


        if (!query) {

          return;

        }


        let found =
          null;


        for (
          const feature of
          state.features
        ) {

          const properties =
            feature.properties || {};


          const name =
            getName(
              properties
            );


          if (
            String(name)
              .toLowerCase()
              .includes(query)
          ) {

            found =
              feature;

            break;

          }

        }


        if (!found) {

          alert(
            "KVGDV Maps: nie znaleziono miejsca."
          );

          return;

        }


        const geometry =
          found.geometry;


        /*
          Szukamy punktu
          reprezentującego obiekt.
        */

        let coordinate =
          null;


        if (
          geometry.type ===
          "Point"
        ) {

          coordinate =
            geometry.coordinates;

        }


        if (
          geometry.type ===
          "MultiPoint" &&
          geometry.coordinates.length
        ) {

          coordinate =
            geometry.coordinates[0];

        }


        if (!coordinate) {

          alert(
            "Obiekt znaleziono, ale nie posiada punktu do wycentrowania."
          );

          return;

        }


        state.centerLon =
          Number(
            coordinate[0]
          );

        state.centerLat =
          Number(
            coordinate[1]
          );


        placeName.textContent =
          getName(
            found.properties
          ) ||
          "Miejsce";


        placeType.textContent =
          getType(
            found.properties
          ) ||
          "Obiekt";


        placeCard.classList.add(
          "visible"
        );


        render();


        setTimeout(
          () => {

            placeCard.classList.remove(
              "visible"
            );

          },
          3000
        );

      }
    );


    /* =========================================
       CTRL + K
    ========================================== */

    document.addEventListener(
      "keydown",
      event => {

        if (
          (
            event.ctrlKey ||
            event.metaKey
          ) &&
          event.key.toLowerCase() ===
            "k"
        ) {

          event.preventDefault();

          searchInput.focus();

        }

      }
    );


    /* =========================================
       MOUSE DOWN
    ========================================== */

    canvas.addEventListener(
      "mousedown",
      event => {

        state.dragging =
          true;

        state.lastMouseX =
          event.clientX;

        state.lastMouseY =
          event.clientY;

        canvas.classList.add(
          "dragging"
        );

      }
    );


    /* =========================================
       MOUSE UP
    ========================================== */

    window.addEventListener(
      "mouseup",
      () => {

        state.dragging =
          false;

        canvas.classList.remove(
          "dragging"
        );

      }
    );


    /* =========================================
       MOUSE MOVE
    ========================================== */

    canvas.addEventListener(
      "mousemove",
      event => {

        state.mouseX =
          event.clientX;

        state.mouseY =
          event.clientY;


        if (
          state.dragging
        ) {

          const dx =
            event.clientX -
            state.lastMouseX;

          const dy =
            event.clientY -
            state.lastMouseY;


          state.centerLon -=
            dx /
            state.zoom;

          state.centerLat +=
            dy /
            state.zoom;


          state.lastMouseX =
            event.clientX;

          state.lastMouseY =
            event.clientY;


          render();

        } else {

          updateCoordinates();

        }

      }
    );


    /* =========================================
       WHEEL
    ========================================== */

    canvas.addEventListener(
      "wheel",
      event => {

        event.preventDefault();


        const before =
          screenToGeo(
            event.clientX,
            event.clientY
          );


        const factor =
          event.deltaY < 0
            ? 1.25
            : 0.8;


        state.zoom *=
          factor;


        state.zoom =
          Math.max(
            500,
            Math.min(
              state.zoom,
              1000000
            )
          );


        const after =
          screenToGeo(
            event.clientX,
            event.clientY
          );


        state.centerLon +=
          before.lon -
          after.lon;

        state.centerLat +=
          before.lat -
          after.lat;


        render();

      },
      {
        passive: false
      }
    );


    /* =========================================
       ZOOM IN
    ========================================== */

    document
      .getElementById("zoomIn")
      .addEventListener(
        "click",
        () => {

          state.zoom *=
            1.25;

          state.zoom =
            Math.min(
              state.zoom,
              1000000
            );

          render();

        }
      );


    /* =========================================
       ZOOM OUT
    ========================================== */

    document
      .getElementById("zoomOut")
      .addEventListener(
        "click",
        () => {

          state.zoom *=
            0.8;

          state.zoom =
            Math.max(
              state.zoom,
              500
            );

          render();

        }
      );


    /* =========================================
       LOCATION
    ========================================== */

    document
      .getElementById("locationButton")
      .addEventListener(
        "click",
        () => {

          if (
            !navigator.geolocation
          ) {

            alert(
              "Geolokalizacja nie jest obsługiwana."
            );

            return;

          }


          navigator.geolocation.getCurrentPosition(

            position => {

              state.centerLat =
                position.coords.latitude;

              state.centerLon =
                position.coords.longitude;


              render();

            },

            () => {

              alert(
                "Nie udało się pobrać lokalizacji."
              );

            }

          );

        }
      );


    /* =========================================
       LOAD GEOJSON
    ========================================== */

    async function loadGeoJSON() {

      try {

        engineStatus.textContent =
          "Ładowanie KVGDV Map Data...";


        loading.classList.remove(
          "hidden"
        );


        /*
          WAŻNE:
          index.html jest w głównym katalogu,
          a GeoJSON w /data/.
        */

        const response =
          await fetch(
            "./data/zachodniopomorskie.geojson",
            {
              cache: "no-store"
            }
          );


        if (!response.ok) {

          throw new Error(
            "HTTP " +
            response.status +
            " — nie znaleziono pliku GeoJSON."
          );

        }


        const json =
          await response.json();


        console.log(
          "KVGDV Maps — GeoJSON:",
          json
        );


        state.data =
          json;


        state.features =
          normalizeGeoJSON(
            json
          );


        /*
          Obliczamy granice danych.
        */

        calculateBounds();


        /*
          Dopasowanie mapy do
          całego GeoJSON.
        */

        fitMapToData();


        /*
          Liczniki.
        */

        let points =
          0;

        let lines =
          0;

        let polygons =
          0;


        for (
          const feature of
          state.features
        ) {

          if (
            !feature.geometry
          ) {

            continue;

          }


          const type =
            feature.geometry.type;


          if (
            type === "Point" ||
            type === "MultiPoint"
          ) {

            points++;

          }


          if (
            type === "LineString" ||
            type === "MultiLineString"
          ) {

            lines++;

          }


          if (
            type === "Polygon" ||
            type === "MultiPolygon"
          ) {

            polygons++;

          }

        }


        engineStatus.textContent =
          "KVGDV Maps Engine · " +
          state.features.length +
          " obiektów · " +
          lines +
          " dróg · " +
          points +
          " punktów";


        loading.classList.add(
          "hidden"
        );


        render();


      } catch (
        error
      ) {

        console.error(
          "KVGDV Maps:",
          error
        );


        engineStatus.textContent =
          "KVGDV Maps Engine · błąd GeoJSON";


        loading.textContent =
          "Nie udało się załadować GeoJSON";


        /*
          Mapa nadal zostaje
          dostępna.
        */

        render();

      }

    }


    /* =========================================
       START
    ========================================== */

    resizeCanvas();

    loadGeoJSON();

  </script>

</body>
</html>
