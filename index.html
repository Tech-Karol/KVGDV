<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ADGVMaker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- TOP BAR -->
        <header class="topbar">

            <div class="brand">
                <div class="brand-logo">A</div>

                <div>
                    <div class="brand-name">ADGVMaker</div>
                    <div class="brand-subtitle">Web Video Editor</div>
                </div>
            </div>

            <nav class="menu">
                <button>File</button>
                <button>Edit</button>
                <button>View</button>
            </nav>

            <div class="top-actions">
                <button id="undoBtn" class="icon-button" title="Undo">↶</button>
                <button id="redoBtn" class="icon-button" title="Redo">↷</button>

                <button id="exportBtn" class="export-button">
                    Export
                </button>
            </div>

        </header>


        <!-- MAIN WORKSPACE -->
        <main class="workspace">

            <!-- LEFT SIDEBAR -->
            <aside class="sidebar">

                <button class="tool active" data-panel="media">
                    <span>▣</span>
                    <label>Media</label>
                </button>

                <button class="tool" data-panel="audio">
                    <span>♫</span>
                    <label>Audio</label>
                </button>

                <button class="tool" data-panel="text">
                    <span>T</span>
                    <label>Text</label>
                </button>

                <button class="tool" data-panel="effects">
                    <span>✦</span>
                    <label>Effects</label>
                </button>

                <button class="tool" data-panel="transitions">
                    <span>◈</span>
                    <label>Transitions</label>
                </button>

            </aside>


            <!-- MEDIA PANEL -->
            <section class="media-panel">

                <div class="panel-header">
                    <h2>Media</h2>

                    <button id="importBtn" class="small-button">
                        + Import
                    </button>

                    <input
                        type="file"
                        id="fileInput"
                        accept="video/*,audio/*,image/*"
                        multiple
                        hidden
                    >
                </div>

                <div id="mediaLibrary" class="media-library">

                    <div id="emptyMedia" class="empty-media">
                        <div class="empty-icon">＋</div>

                        <strong>Import media</strong>

                        <span>
                            Drag files here or click Import
                        </span>
                    </div>

                </div>

            </section>


            <!-- CENTER -->
            <section class="editor">

                <!-- PREVIEW -->
                <div class="preview-area">

                    <div class="preview-container">

                        <video
                            id="videoPreview"
                            preload="metadata"
                        ></video>

                        <div
                            id="previewPlaceholder"
                            class="preview-placeholder"
                        >
                            <div class="placeholder-logo">
                                A
                            </div>

                            <strong>
                                ADGVMaker
                            </strong>

                            <span>
                                Import a video to start editing
                            </span>
                        </div>

                    </div>

                </div>


                <!-- CONTROLS -->
                <div class="player-controls">

                    <span id="currentTime">
                        00:00
                    </span>

                    <button
                        id="playBtn"
                        class="play-button"
                    >
                        ▶
                    </button>

                    <div class="player-progress">

                        <input
                            type="range"
                            id="seekBar"
                            min="0"
                            max="100"
                            value="0"
                            step="0.01"
                        >

                    </div>

                    <span id="duration">
                        00:00
                    </span>

                </div>


                <!-- TIMELINE -->
                <section class="timeline">

                    <div class="timeline-header">

                        <div class="timeline-title">
                            Timeline
                        </div>

                        <div class="timeline-actions">

                            <button
                                id="splitBtn"
                                title="Split clip"
                            >
                                ✂ Split
                            </button>

                            <button
                                id="deleteBtn"
                                title="Delete selected clip"
                            >
                                🗑 Delete
                            </button>

                        </div>

                    </div>


                    <div class="timeline-body">

                        <div class="time-ruler" id="timeRuler">
                            <span>00:00</span>
                            <span>00:10</span>
                            <span>00:20</span>
                            <span>00:30</span>
                            <span>00:40</span>
                            <span>00:50</span>
                        </div>


                        <div class="track">

                            <div class="track-label">
                                🎬 Video
                            </div>

                            <div
                                id="videoTrack"
                                class="track-content"
                            ></div>

                        </div>


                        <div class="track">

                            <div class="track-label">
                                🔊 Audio
                            </div>

                            <div
                                id="audioTrack"
                                class="track-content"
                            ></div>

                        </div>


                        <div class="track">

                            <div class="track-label">
                                T Text
                            </div>

                            <div
                                id="textTrack"
                                class="track-content"
                            ></div>

                        </div>

                    </div>

                </section>

            </section>


            <!-- RIGHT SIDEBAR -->
            <aside class="properties">

                <div class="properties-header">
                    <h2>Properties</h2>
                </div>

                <div
                    id="propertiesContent"
                    class="properties-content"
                >

                    <div class="no-selection">

                        <div class="no-selection-icon">
                            ◇
                        </div>

                        <strong>
                            Nothing selected
                        </strong>

                        <span>
                            Select a clip to edit its properties.
                        </span>

                    </div>

                </div>

            </aside>

        </main>

    </div>


    <script src="app.js"></script>

</body>
</html>
